<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, rtk-meeting { margin: 0; width: 100%; height: 100%; background: #000; }
    body { overflow: hidden; }
  </style>
</head>
<body>
  <rtk-meeting id="meeting" mode="fill" show-setup-screen="false"></rtk-meeting>
  <script type="module">
    import { defineCustomElements } from 'https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit-ui@1.2.0/loader/index.es2017.js';
    defineCustomElements();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit@1.5.1/dist/browser.js"></script>
  <script>
    (async () => {
      const notifyParent = (type, message = '') => {
        if (window.parent === window) return;
        window.parent.postMessage({ source: 'alluwal-realtimekit', type, message }, location.origin);
      };
      try {
        const params = new URLSearchParams(location.hash.slice(1));
        const authToken = params.get('token');
        if (!authToken) throw new Error('Missing class access token.');
        const initWithMedia = RealtimeKitClient.init({ authToken });
        let meeting;
        try {
          meeting = await Promise.race([
            initWithMedia,
            new Promise((_, reject) => setTimeout(() => reject(new Error('Media initialization timed out.')), 8000)),
          ]);
        } catch (initialError) {
          meeting = await RealtimeKitClient.init({
            authToken,
            defaults: { audio: false, video: false },
          });
          notifyParent('media-disabled', initialError instanceof Error ? initialError.message : 'Media devices are unavailable.');
        }
        document.getElementById('meeting').meeting = meeting;
        notifyParent('ready');
      } catch (error) {
        notifyParent('error', error instanceof Error ? error.message : 'Unable to initialize the class meeting.');
      }
    })();
  </script>
</body>
</html>
