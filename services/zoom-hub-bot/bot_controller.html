<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alluwal Zoom Hub Bot</title>
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.2.0/css/bootstrap.css" />
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.2.0/css/react-select.css" />
  <style>
    html, body, #zmmtg-root {
      width: 640px;
      height: 480px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #status {
      position: fixed;
      z-index: 999999;
      inset: 12px auto auto 12px;
      max-width: 520px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>
<body>
  <div id="status">Starting Zoom hub bot...</div>
  <div id="zmmtg-root"></div>

  <script src="routing.js"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js"></script>
  <script src="https://source.zoom.us/zoom-meeting-6.2.0.min.js"></script>
  <script>
    (function runBotController() {
      const params = new URLSearchParams(window.location.search);
      const config = {
        functionBaseUrl: (params.get('functionBaseUrl') || '').replace(/\/+$/, ''),
        botKey: params.get('botKey') || '',
        lane: params.get('lane') || '',
        hubDocId: params.get('hubDocId') || '',
        sdkKey: params.get('sdkKey') || '',
        signature: params.get('signature') || '',
        meetingNumber: params.get('meetingNumber') || '',
        password: params.get('password') || '',
        zak: params.get('zak') || '',
        hostAccount: params.get('hostAccount') || '',
        rooms: [],
        boIdByRoomName: {},
        windowEnd: params.get('windowEnd') || '',
      };
      try {
        config.rooms = JSON.parse(params.get('rooms') || '[]').map((name) => String(name || '').trim()).filter(Boolean);
      } catch (_) {
        config.rooms = [];
      }
      try {
        const storedMap = JSON.parse(params.get('boIdByRoomName') || '{}');
        config.boIdByRoomName = storedMap && typeof storedMap === 'object' ? storedMap : {};
      } catch (_) {
        config.boIdByRoomName = {};
      }

      const routing = window.ZoomHubRouting;
      const statusEl = document.getElementById('status');
      let joined = false;
      let roomsOpened = false;
      let leaving = false;
      let lastBoIdByRoomName = config.boIdByRoomName || {};
      let liveBoIdByRoomName = {};
      let lastRoutingSnapshotLogAt = 0;
      const routeIntervalMs = 3000;
      const heartbeatIntervalMs = 15000;

      function setStatus(message) {
        if (statusEl) statusEl.textContent = message;
        console.log(message);
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function serializeError(error) {
        if (!error) return '';
        if (typeof error === 'string') return error;
        if (error instanceof Error) {
          return JSON.stringify({
            name: error.name,
            message: error.message,
            stack: error.stack,
          });
        }
        try {
          return JSON.stringify(error);
        } catch (_) {
          return String(error);
        }
      }

      function zoomCall(method, args) {
        return new Promise((resolve, reject) => {
          if (!window.ZoomMtg || typeof window.ZoomMtg[method] !== 'function') {
            reject(new Error(`Zoom method unavailable: ${method}`));
            return;
          }
          try {
            window.ZoomMtg[method]({
              ...(args || {}),
              success: (value) => resolve(value),
              error: (error) => reject(error),
            });
          } catch (error) {
            reject(error);
          }
        });
      }

      async function botFetch(path, options) {
        const response = await fetch(`${config.functionBaseUrl}${path}`, {
          ...(options || {}),
          headers: {
            'x-bot-key': config.botKey,
            ...((options && options.body) ? { 'content-type': 'application/json' } : {}),
            ...((options && options.headers) || {}),
          },
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || body.success === false) {
          throw new Error(body.error || `HTTP ${response.status}`);
        }
        return body;
      }

      async function postState(status, extra) {
        await botFetch('/zoomHubBotState', {
          method: 'POST',
          body: JSON.stringify({
            hubDocId: config.hubDocId,
            status,
            boIdByRoomName: lastBoIdByRoomName,
            stats: {
              lane: config.lane,
              roomCount: config.rooms.length,
              roomsOpened,
              joined,
              ...(extra && extra.stats ? extra.stats : {}),
            },
            error: extra && extra.error ? String(extra.error) : null,
            error_detail: extra && extra.error ? serializeError(extra.error) : null,
          }),
        });
      }

      async function getAssignments() {
        return botFetch(`/zoomHubBotAssignments?hubDocId=${encodeURIComponent(config.hubDocId)}`);
      }

      function normalizeBreakoutPayload(payload) {
        const rooms = routing.normalizeRooms(payload);
        const unassigned = routing.normalizeUnassigned(payload);
        return { rooms, unassigned };
      }

      function buildBoIdMap(rooms) {
        const map = {};
        for (const room of rooms || []) {
          const name = routing.roomName(room);
          const boId = routing.roomId(room);
          if (name && boId) map[name] = boId;
        }
        return map;
      }

      function rememberLiveRooms(rooms) {
        const map = buildBoIdMap(rooms);
        if (Object.keys(map).length > 0) {
          liveBoIdByRoomName = map;
          lastBoIdByRoomName = map;
        }
        return map;
      }

      function summarizeRoom(room) {
        if (!room || typeof room !== 'object') return {};
        const participants = routing.roomParticipants(room);
        return {
          name: routing.roomName(room),
          id: routing.roomId(room),
          idFields: Object.fromEntries(
            ['boId', 'boID', 'boid', 'bo_id', 'roomId', 'roomID', 'room_id', 'breakoutRoomId', 'breakout_room_id', 'id']
              .filter((key) => room[key] !== undefined && room[key] !== null && room[key] !== '')
              .map((key) => [key, String(room[key])]),
          ),
          participantCount: participants.length,
        };
      }

      function summarizeParticipant(participant) {
        if (!participant || typeof participant !== 'object') return {};
        return {
          uid: routing.zoomCustomerKey(participant),
          userId: routing.zoomUserId(participant),
          name: String(participant.userName || participant.user_name || participant.displayName || participant.display_name || '').trim(),
          keys: Object.keys(participant).slice(0, 20),
        };
      }

      function summarizeBreakoutPayload(payload, normalized) {
        const result = payload && typeof payload === 'object' && payload.result && typeof payload.result === 'object'
          ? payload.result
          : {};
        return {
          topKeys: payload && typeof payload === 'object' ? Object.keys(payload).slice(0, 20) : [],
          resultKeys: Object.keys(result).slice(0, 30),
          roomCount: normalized.rooms.length,
          breakoutUnassigned: normalized.unassigned.map(summarizeParticipant),
        };
      }

      function roomsFromLiveBoIds(assignments) {
        const rooms = [];
        const assignedRooms = Array.isArray(assignments?.rooms) ? assignments.rooms : [];
        for (const room of assignedRooms) {
          const name = String(room?.name || '').trim();
          const boId = liveBoIdByRoomName[name];
          if (name && boId) rooms.push({ name, boId, participants: [] });
        }
        return rooms;
      }

      function roomsWithStoredBoIds(rooms) {
        return (Array.isArray(rooms) ? rooms : []).map((room) => {
          if (routing.roomId(room)) return room;
          const name = routing.roomName(room);
          const boId = lastBoIdByRoomName[name];
          return name && boId ? { ...room, boId } : room;
        });
      }

      function isVisibleElement(element) {
        if (!element || !element.getBoundingClientRect) return false;
        const rect = element.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return false;
        const style = window.getComputedStyle(element);
        return style.visibility !== 'hidden' && style.display !== 'none' && Number(style.opacity || 1) > 0;
      }

      function controlText(element) {
        return [
          element?.innerText,
          element?.textContent,
          element?.getAttribute?.('aria-label'),
          element?.getAttribute?.('title'),
        ].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
      }

      function clickZoomControl(matcher, options = {}) {
        const blocked = options.blocked || /\b(close all|end meeting|end for all|leave meeting|leave room)\b/i;
        const nodes = Array.from(document.querySelectorAll(
          'button,[role="button"],a,li,[aria-label],[title],.footer-button-base__button',
        ));
        for (const node of nodes) {
          if (!isVisibleElement(node)) continue;
          const text = controlText(node);
          if (!text || blocked.test(text) || !matcher.test(text)) continue;
          const target = node.closest('button,[role="button"],a,li') || node;
          if (!isVisibleElement(target)) continue;
          target.click();
          return text;
        }
        return '';
      }

      async function primeBreakoutUi(reason) {
        let clicked = clickZoomControl(/\bbreakout\s*rooms?\b/i);
        if (!clicked) {
          const more = clickZoomControl(/^\s*more\s*$/i, { blocked: /\b(end meeting|leave meeting)\b/i });
          if (more) {
            await sleep(500);
            clicked = clickZoomControl(/\bbreakout\s*rooms?\b/i);
          }
        }
        if (clicked) {
          console.log('Breakout UI prime', JSON.stringify({ reason, clicked }));
          await sleep(1200);
          return true;
        }
        console.warn('Breakout UI prime did not find a control', reason);
        await sleep(300);
        return false;
      }

      async function readBreakoutState() {
        const breakoutPayload = await zoomCall('getBreakoutRooms');
        const attendeesPayload = await zoomCall('getAttendeeslist').catch(() => []);
        const normalized = normalizeBreakoutPayload(breakoutPayload);
        rememberLiveRooms(normalized.rooms);
        const attendeeList = Array.isArray(attendeesPayload)
          ? attendeesPayload
          : routing.normalizeUnassigned(attendeesPayload);
        const breakoutUnassigned = normalized.unassigned;
        const assignedUids = new Set();
        for (const room of normalized.rooms) {
          for (const participant of routing.roomParticipants(room)) {
            const uid = routing.zoomCustomerKey(participant);
            if (uid) assignedUids.add(uid);
          }
        }
        const unassignedByParticipant = new Map();
        for (const participant of normalized.unassigned) {
          const uid = routing.zoomCustomerKey(participant);
          const userId = routing.zoomUserId(participant);
          const key = uid && userId !== null ? `${uid}:${String(userId)}` : uid;
          if (uid && key) unassignedByParticipant.set(key, participant);
        }
        for (const participant of attendeeList) {
          const uid = routing.zoomCustomerKey(participant);
          const userId = routing.zoomUserId(participant);
          const key = uid && userId !== null ? `${uid}:${String(userId)}` : uid;
          if (uid && key && !assignedUids.has(uid) && !unassignedByParticipant.has(key)) {
            unassignedByParticipant.set(key, participant);
          }
        }
        return {
          rooms: normalized.rooms,
          unassigned: Array.from(unassignedByParticipant.values()),
          breakoutUnassigned,
          attendeeList,
          breakoutPayloadSummary: summarizeBreakoutPayload(breakoutPayload, normalized),
        };
      }

      async function getBreakoutState(options = {}) {
        const state = await readBreakoutState();
        if (state.rooms.length > 0 || !options.primeIfEmpty) return state;
        await primeBreakoutUi(options.reason || 'empty_rooms');
        return readBreakoutState();
      }

      function isInvalidOperation(error) {
        const text = JSON.stringify(error || {}).toLowerCase();
        return text.includes('invalid_operation') || text.includes('already') || text.includes('started');
      }

      function breakoutStatusValue(payload) {
        if (typeof payload === 'number') return payload;
        if (!payload || typeof payload !== 'object') return null;
        // Zoom wraps responses as {status: <success boolean>, result: <value>}
        // — the boolean is NOT the room status, so only trust numeric fields.
        const candidates = [
          typeof payload.status === 'number' ? payload.status : undefined,
          typeof payload.result === 'number' ? payload.result : undefined,
          payload.result && typeof payload.result === 'object'
            ? payload.result.status ?? payload.result.value
            : undefined,
          typeof payload.value === 'number' ? payload.value : undefined,
        ];
        for (const raw of candidates) {
          const number = Number(raw);
          if (Number.isFinite(number)) return number;
          if (typeof raw === 'string') {
            const text = raw.toLowerCase();
            if (text.includes('progress') || text.includes('started') || text.includes('open')) return 2;
            if (text.includes('closed') || text.includes('not started')) return 4;
          }
        }
        return null;
      }

      function isAlreadyStartedError(error) {
        return /breakout room has started/i.test(JSON.stringify(error || {}));
      }

      const desiredRoomOptions = {
        isAutoJoinRoom: true,
        isBackToMainSessionEnabled: false,
        isTimerEnabled: false,
        needCountDown: false,
      };

      function unwrapResult(payload) {
        if (payload && typeof payload === 'object' && payload.result && typeof payload.result === 'object') {
          return payload.result;
        }
        return payload && typeof payload === 'object' ? payload : {};
      }

      // Breakout options freeze at the FIRST openBreakoutRooms and cannot be
      // changed while rooms are open. Unreadable options count as mismatched:
      // stale options (invitation mode instead of auto-pull) are exactly the
      // failure we cannot detect any other way.
      function roomOptionsMismatch(rawOptions) {
        const options = unwrapResult(rawOptions);
        if (typeof options.isAutoJoinRoom !== 'boolean') return true;
        return options.isAutoJoinRoom !== desiredRoomOptions.isAutoJoinRoom ||
          options.isBackToMainSessionEnabled !== desiredRoomOptions.isBackToMainSessionEnabled;
      }

      function inRoomParticipantCount(state) {
        return (state.rooms || []).reduce(
          (sum, room) => sum + routing.roomParticipants(room).length,
          0,
        );
      }

      function nonBotAttendeeCount(state) {
        const botUid = `zoom_hub_bot_lane_${config.lane}`;
        const attendees = state?.attendeeList && state.attendeeList.length > 0
          ? state.attendeeList
          : state?.unassigned || [];
        const seen = new Set();
        for (const participant of attendees) {
          const uid = routing.zoomCustomerKey(participant);
          const userId = routing.zoomUserId(participant);
          const key = uid || String(userId || '');
          if (!key || key === botUid || seen.has(key)) continue;
          seen.add(key);
        }
        return seen.size;
      }

      async function currentBreakoutStatus() {
        const status = await zoomCall('getBreakoutRoomStatus').catch(() => null);
        return breakoutStatusValue(status);
      }

      async function waitForRoomsClosed(timeoutMs = 90000) {
        const startedAt = Date.now();
        while (Date.now() - startedAt < timeoutMs) {
          const status = await currentBreakoutStatus();
          if (status !== 2 && status !== 3) return true;
          await sleep(2000);
        }
        return false;
      }

      // Returns true when it closed stale rooms (caller should retry a fresh
      // create+open pass). Never closes occupied rooms.
      async function closeRoomsIfStale(breakoutState) {
        const options = await zoomCall('getBreakoutRoomOptions').catch(() => null);
        console.log('BO options payload', JSON.stringify(options));
        if (!roomOptionsMismatch(options)) return false;
        if (inRoomParticipantCount(breakoutState) > 0) {
          console.error(
            'Breakout options are stale but rooms are occupied; not reopening',
            unwrapResult(options),
          );
          await postState('error', { error: 'stale_breakout_options_with_occupants' })
            .catch(() => {});
          return false;
        }
        setStatus('Reopening rooms: stale breakout options detected');
        await zoomCall('closeBreakoutRooms')
          .catch((error) => console.warn('closeBreakoutRooms failed', error));
        await waitForRoomsClosed();
        return true;
      }

      async function ensureRoomsOpen() {
        let breakoutState = await getBreakoutState();

        for (let attempt = 0; attempt < 2; attempt += 1) {
          const statusPayload = await zoomCall('getBreakoutRoomStatus').catch(() => null);
          console.log('BO status payload', JSON.stringify(statusPayload));
          const inProgress = breakoutStatusValue(statusPayload) === 2;
          const existingNames = new Set(
            breakoutState.rooms.map((room) => routing.normalizeRoomName(routing.roomName(room))).filter(Boolean),
          );
          const missingRooms = config.rooms.filter((name) => !existingNames.has(routing.normalizeRoomName(name)));

          if (inProgress) {
            if (
              breakoutState.rooms.length === 0 &&
              Object.keys(lastBoIdByRoomName).length > 0
            ) {
              if (nonBotAttendeeCount(breakoutState) === 0) {
                setStatus('Reopening rooms: current bot cannot read existing rooms');
                lastBoIdByRoomName = {};
                liveBoIdByRoomName = {};
                await zoomCall('closeBreakoutRooms')
                  .catch((error) => console.warn('closeBreakoutRooms failed', error));
                await waitForRoomsClosed();
                breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_close_unreadable' });
                continue;
              }
              console.error('Breakout rooms are unreadable while attendees are present; not reopening');
              await postState('error', { error: 'breakout_rooms_unreadable_with_attendees' })
                .catch(() => {});
              break;
            }
            if (missingRooms.length > 0) {
              try {
                setStatus(`Adding ${missingRooms.length} breakout rooms`);
                const createdPayload = await zoomCall('createBreakoutRoom', { data: missingRooms, pattern: 2 });
                const createdRooms = routing.normalizeRooms(createdPayload);
                rememberLiveRooms(createdRooms);
                console.log('Add breakout rooms payload', JSON.stringify({
                  roomCount: createdRooms.length,
                  rooms: createdRooms.map(summarizeRoom),
                }));
                breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_add_live_rooms' });
              } catch (error) {
                console.warn('Live room creation rejected; continuing with current rooms', error);
                await postState('error', { error: `live_room_creation_failed:${serializeError(error)}` })
                  .catch(() => {});
              }
            }
            if (attempt === 0 && await closeRoomsIfStale(breakoutState)) {
              breakoutState = await getBreakoutState();
              continue;
            }
            break;
          }

          let learnedRoomsStarted = false;
          if (missingRooms.length > 0) {
            try {
              setStatus(`Creating ${missingRooms.length} breakout rooms`);
              const createdPayload = await zoomCall('createBreakoutRoom', { data: missingRooms, pattern: 2 });
              const createdRooms = routing.normalizeRooms(createdPayload);
              rememberLiveRooms(createdRooms);
              console.log('Create breakout rooms payload', JSON.stringify({
                roomCount: createdRooms.length,
                rooms: createdRooms.map(summarizeRoom),
              }));
            } catch (error) {
              if (!isInvalidOperation(error)) throw error;
              learnedRoomsStarted = learnedRoomsStarted || isAlreadyStartedError(error);
              console.warn('Room creation rejected; continuing to open step', error);
            }
            breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_create' });
          }

          setStatus('Opening breakout rooms');
          try {
            const openPayload = await zoomCall('openBreakoutRooms', { options: desiredRoomOptions });
            console.log('Open breakout rooms payload', JSON.stringify(openPayload));
          } catch (error) {
            if (!isInvalidOperation(error)) throw error;
            learnedRoomsStarted = learnedRoomsStarted || isAlreadyStartedError(error);
            console.warn('Rooms already open', error);
          }
          await sleep(1500);
          breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_open' });

          // Status probe said "not started" but Zoom's errors say otherwise:
          // rooms are open, options may be stale — verify once and retry.
          if (learnedRoomsStarted && attempt === 0 && await closeRoomsIfStale(breakoutState)) {
            breakoutState = await getBreakoutState();
            continue;
          }
          break;
        }

        rememberLiveRooms(breakoutState.rooms);
        roomsOpened = true;
        await postState('roomsOpen');
        setStatus(`Rooms open for ${config.hubDocId}`);
      }

      async function routeOnce() {
        const assignments = await getAssignments();
        const zoomState = await getBreakoutState({ primeIfEmpty: true, reason: 'route_once' });
        rememberLiveRooms(zoomState.rooms);
        if (zoomState.rooms.length === 0 && Object.keys(liveBoIdByRoomName).length > 0) {
          zoomState.rooms = roomsFromLiveBoIds(assignments);
        } else if (zoomState.rooms.length > 0 && Object.keys(lastBoIdByRoomName).length > 0) {
          zoomState.rooms = roomsWithStoredBoIds(zoomState.rooms);
        }
        const actions = routing.whoNeedsToMoveWhere(assignments, zoomState);
        const now = Date.now();
        if (now - lastRoutingSnapshotLogAt > 15000 || actions.length > 0) {
          lastRoutingSnapshotLogAt = now;
          console.log('Routing snapshot', JSON.stringify({
            rooms: zoomState.rooms.map(summarizeRoom),
            unassigned: zoomState.unassigned.map((participant) => ({
              uid: routing.zoomCustomerKey(participant),
              userId: routing.zoomUserId(participant),
            })),
            breakoutUnassigned: (zoomState.breakoutUnassigned || []).map(summarizeParticipant),
            attendeeList: (zoomState.attendeeList || []).map(summarizeParticipant),
            breakoutPayload: zoomState.breakoutPayloadSummary || null,
            actions: actions.map((action) => ({
              uid: action.uid,
              userId: action.userId,
              action: action.action,
              targetRoomName: action.targetRoomName,
              targetRoomId: action.targetRoomId,
            })),
          }));
        }
        const participants = [
          ...zoomState.unassigned,
          ...zoomState.rooms.flatMap((room) => routing.roomParticipants(room)),
        ];
        for (const action of actions) {
          const method = action.action === 'move'
            ? 'moveUserToBreakoutRoom'
            : 'assignUserToBreakoutRoom';
          await zoomCall(method, {
            userId: action.userId,
            targetRoomId: action.targetRoomId,
          }).catch((error) => {
            console.warn(`${method} failed for ${action.uid}`, error);
          });
          if (action.action === 'assign') {
            await sleep(250);
            await zoomCall('moveUserToBreakoutRoom', {
              userId: action.userId,
              targetRoomId: action.targetRoomId,
            }).catch((error) => {
              console.warn(`moveUserToBreakoutRoom after assign failed for ${action.uid}`, error);
            });
          }
        }
        await postState('roomsOpen', {
          stats: {
            routedCount: actions.length,
            attendeeCount: zoomState.unassigned.length + zoomState.rooms.reduce((sum, room) => (
              sum + routing.roomParticipants(room).length
            ), 0),
            customerKeyCount: participants.filter((participant) => routing.zoomCustomerKey(participant)).length,
            routableRoomCount: zoomState.rooms.filter((room) => routing.roomId(room)).length,
            targetMemberCount: Array.isArray(assignments.members) ? assignments.members.length : 0,
          },
        });
      }

      function shouldLeave() {
        if (!config.windowEnd) return false;
        const end = new Date(config.windowEnd).getTime();
        return Number.isFinite(end) && Date.now() > end;
      }

      async function leaveMeeting() {
        if (leaving) return;
        leaving = true;
        await postState('left').catch(() => {});
        if (window.ZoomMtg && typeof window.ZoomMtg.leaveMeeting === 'function') {
          await zoomCall('leaveMeeting').catch(() => {});
        }
      }

      async function routingLoop() {
        let lastHeartbeat = 0;
        while (!leaving) {
          if (shouldLeave()) {
            await leaveMeeting();
            return;
          }
          try {
            await routeOnce();
            const now = Date.now();
            if (now - lastHeartbeat > heartbeatIntervalMs) {
              await postState('roomsOpen');
              lastHeartbeat = now;
            }
          } catch (error) {
            console.error('Routing loop failed', error);
            await postState('error', { error }).catch(() => {});
          }
          await sleep(routeIntervalMs);
        }
      }

      function joinMeeting() {
        setStatus(`Joining hub ${config.hubDocId}`);
        window.ZoomMtg.setZoomJSLib('https://source.zoom.us/6.2.0/lib', '/av');
        window.ZoomMtg.preLoadWasm();
        window.ZoomMtg.prepareWebSDK();
        window.ZoomMtg.i18n.load('en-US');
        window.ZoomMtg.i18n.reload('en-US');
        window.ZoomMtg.init({
          leaveUrl: 'about:blank',
          disableJoinAudio: true,
          disablePreview: true,
          disableCallOut: true,
          disableVoIP: true,
          isSupportAV: false,
          disableCORP: true,
          success: () => {
            window.ZoomMtg.join({
              sdkKey: config.sdkKey,
              signature: config.signature,
              meetingNumber: config.meetingNumber,
              passWord: config.password,
              userName: `Alluwal Hub Bot Lane ${config.lane}`,
              userEmail: config.hostAccount,
              customerKey: `zoom_hub_bot_lane_${config.lane}`,
              zak: config.zak,
              success: async () => {
                joined = true;
                setStatus('Joined as host');
                await postState('joined').catch(() => {});
                await ensureRoomsOpen();
                routingLoop();
              },
              error: async (error) => {
                setStatus('Zoom join failed');
                console.error('Zoom join failed detail', serializeError(error));
                await postState('error', { error }).catch(() => {});
                throw error;
              },
            });
          },
          error: async (error) => {
            setStatus('Zoom init failed');
            console.error('Zoom init failed detail', serializeError(error));
            await postState('error', { error }).catch(() => {});
            throw error;
          },
        });
      }

      joinMeeting();
    })();
  </script>
</body>
</html>
