<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alluwal Zoom Hub Bot</title>
  <style>
    html, body, #zmmtg-root {
      width: 640px;
      height: 480px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #status {
      position: fixed;
      z-index: 999999;
      inset: 12px auto auto 12px;
      max-width: 520px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>
<body>
  <div id="status">Starting Zoom hub bot...</div>
  <div id="zmmtg-root"></div>

  <script src="routing.js"></script>
  <script src="sdk_health.js"></script>
  <script>
    // The Zoom Web SDK version comes from bot.js (ZOOM_HUB_BOT_SDK_VERSION), so
    // moving between versions, or back, is a restart rather than a code change.
    // Parser-inserted with document.write so the bundles still load in order.
    (function loadZoomSdk() {
      const DEFAULT_ZOOM_SDK_VERSION = '6.10.0';
      const requested = new URLSearchParams(window.location.search).get('sdkVersion') || '';
      const version = /^\d+\.\d+\.\d+$/.test(requested) ? requested : DEFAULT_ZOOM_SDK_VERSION;
      window.ZOOM_SDK_VERSION = version;
      const base = `https://source.zoom.us/${version}`;
      const scripts = [
        `${base}/lib/vendor/react.min.js`,
        `${base}/lib/vendor/react-dom.min.js`,
        `${base}/lib/vendor/redux.min.js`,
        `${base}/lib/vendor/redux-thunk.min.js`,
        // Required from 6.5.0 on ("ReactRedux is not defined" without it);
        // served for 6.2.0 too and harmless there.
        `${base}/lib/vendor/react-redux.min.js`,
        `${base}/lib/vendor/lodash.min.js`,
        `https://source.zoom.us/zoom-meeting-${version}.min.js`,
      ];
      for (const src of scripts) document.write(`<script src="${src}"><\/script>`);
    })();
  </script>
  <script>
    (function runBotController() {
      const params = new URLSearchParams(window.location.search);
      const config = {
        functionBaseUrl: (params.get('functionBaseUrl') || '').replace(/\/+$/, ''),
        botKey: params.get('botKey') || '',
        lane: params.get('lane') || '',
        hubDocId: params.get('hubDocId') || '',
        sdkKey: params.get('sdkKey') || '',
        signature: params.get('signature') || '',
        meetingNumber: params.get('meetingNumber') || '',
        password: params.get('password') || '',
        zak: params.get('zak') || '',
        hostAccount: params.get('hostAccount') || '',
        rooms: [],
        boIdByRoomName: {},
        windowEnd: params.get('windowEnd') || '',
        // Latest moment to wait for an earlier host session of this lane to
        // leave the meeting before opening rooms anyway (bot.js sets it).
        oldHostDeadline: Number(params.get('oldHostDeadline')) || 0,
      };
      try {
        config.rooms = JSON.parse(params.get('rooms') || '[]').map((name) => String(name || '').trim()).filter(Boolean);
      } catch (_) {
        config.rooms = [];
      }
      try {
        const storedMap = JSON.parse(params.get('boIdByRoomName') || '{}');
        config.boIdByRoomName = storedMap && typeof storedMap === 'object' ? storedMap : {};
      } catch (_) {
        config.boIdByRoomName = {};
      }

      const routing = window.ZoomHubRouting;
      const statusEl = document.getElementById('status');
      let joined = false;
      let roomsOpened = false;
      let leaving = false;
      // When this page instance loaded. Used to honor a backend force-rejoin
      // signal (reload = clean rejoin into a fresh meeting instance) and to
      // recover from a "zombie" session where the meeting ended server-side but
      // our SDK keeps reporting stale rooms.
      const pageLoadedAt = Date.now();
      let rejoinTriggered = false;
      const triggerRejoin = (reason) => {
        if (rejoinTriggered) return;
        rejoinTriggered = true;
        // Cap reloads within a single page lifetime so a persistently failing
        // rejoin cannot loop forever; systemd + backend watcher remain backstops.
        let reloadCount = 0;
        try {
          reloadCount = Number(window.sessionStorage.getItem('alluwal_rejoin_count') || '0') || 0;
          window.sessionStorage.setItem('alluwal_rejoin_count', String(reloadCount + 1));
        } catch (_) {}
        if (reloadCount >= 5) {
          console.error(`Rejoin cap reached (${reloadCount}); not reloading again (${reason})`);
          return;
        }
        console.warn(`Reloading to rejoin a fresh meeting instance (reason: ${reason}, reload #${reloadCount + 1})`);
        setTimeout(() => window.location.reload(), 500);
      };
      let lastBoIdByRoomName = config.boIdByRoomName || {};
      let liveBoIdByRoomName = {};
      let lastRoutingSnapshotLogAt = 0;
      const routeIntervalMs = 3000;
      const heartbeatIntervalMs = 15000;
      // Self-heal state: the Zoom SDK's breakout room list (getBreakoutRooms)
      // can go empty and stay empty on a busy hub. When it does, the bot cannot
      // assign anyone. We repair by close+reopen, but only when it is safe for
      // people already INSIDE rooms. These track what we last knew about room
      // occupancy so the heal never bumps a live class.
      let haveReadRoomsThisSession = false;
      let lastKnownInRoomCount = 0;
      let lastReadableRoomsAt = 0;
      let roomsCreatedFresh = false;
      let lastHealAttemptAt = 0;
      const healThrottleMs = 20000;
      const forceRejoinSettleMs = 90000;
      // When an in-place close+reopen cannot restore a readable room list, the
      // meeting instance is corrupted beyond repair. After this many consecutive
      // failed self-heals we ask the backend to END the meeting so we can rejoin
      // a clean instance — only ever when no one is inside a room.
      let consecutiveHealFailures = 0;
      const healFailuresBeforeReset = 2;
      let resetRequested = false;
      const assignedNotJoinedByParticipant = new Map();
      const assignedNotJoinedThresholdMs = 20000;
      let assignedNotJoinedRepairAttempts = 0;
      const controllerVersion = '2026-11-23-fast-recovery-v1';
      console.log('Controller version', controllerVersion, 'Zoom SDK', window.ZOOM_SDK_VERSION);
      const sdkHealthApi = window.ZoomHubSdkHealth;
      const sdkHealth = sdkHealthApi.createTracker();
      let connectionDead = false;
      // When this page's first state report was accepted. A backend force-rejoin
      // stamped right after it was decided on the heartbeat from before this
      // page joined (see routeOnce), so it is not acted on.
      let firstStateAcceptedAt = 0;
      // The SDK prints this when an action finds its socket gone. Healthy hubs
      // print it now and then, so on its own it decides nothing; it makes a
      // missed deadline count sooner.
      const originalConsoleError = console.error.bind(console);
      console.error = (...args) => {
        try {
          if (args.some((arg) => String((arg && arg.message) || arg).includes(sdkHealthApi.SOCKET_ERROR_MARKER))) {
            sdkHealth.noteSocketError(Date.now());
          }
        } catch (_) {}
        originalConsoleError(...args);
      };
      window.addEventListener('error', (event) => {
        if (String(event && event.message).includes(sdkHealthApi.SOCKET_ERROR_MARKER)) {
          sdkHealth.noteSocketError(Date.now());
        }
      });

      function setStatus(message) {
        if (statusEl) statusEl.textContent = message;
        console.log(message);
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function serializeError(error) {
        if (!error) return '';
        if (typeof error === 'string') return error;
        if (error instanceof Error) {
          return JSON.stringify({
            name: error.name,
            message: error.message,
            stack: error.stack,
          });
        }
        try {
          return JSON.stringify(error);
        } catch (_) {
          return String(error);
        }
      }

      // Each Zoom call gets a deadline. Without one, a call the SDK never
      // answers — what it does once its connection to Zoom is gone — held the
      // routing loop forever, and only the 3-minute silence check in bot.js
      // noticed (four times on 2026-11-20). A missed deadline is also the
      // evidence sdkHealth judges the connection on.
      function zoomCall(method, args, timeoutMs) {
        const startedAt = Date.now();
        const limitMs = Number(timeoutMs) > 0 ? Number(timeoutMs) : sdkHealthApi.callTimeoutMs(method);
        return new Promise((resolve, reject) => {
          if (!window.ZoomMtg || typeof window.ZoomMtg[method] !== 'function') {
            reject(new Error(`Zoom method unavailable: ${method}`));
            return;
          }
          let settled = false;
          const settle = (outcome, value, error) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            noteZoomOutcome(method, outcome, { startedAt, at: Date.now(), error });
            if (outcome === 'ok') resolve(value);
            else reject(error);
          };
          const timer = setTimeout(() => {
            const error = new Error(`Zoom call ${method} got no answer in ${Math.round(limitMs / 1000)}s`);
            error.zoomCallTimedOut = true;
            error.method = method;
            settle('timeout', null, error);
          }, limitMs);
          try {
            window.ZoomMtg[method]({
              ...(args || {}),
              success: (value) => settle('ok', value),
              error: (error) => settle('error', null, error),
            });
          } catch (error) {
            settle('error', null, error);
          }
        });
      }

      function noteZoomOutcome(method, outcome, detail) {
        const verdict = sdkHealth.record(method, outcome, detail);
        if (verdict && verdict.dead) declareConnectionDead(verdict.reason);
      }

      // The page's own connection is gone: stop acting on it and tell bot.js,
      // which recycles the page and rejoins once the old host session clears.
      function declareConnectionDead(reason) {
        if (connectionDead) return;
        connectionDead = true;
        console.error(`${sdkHealthApi.DEAD_MARKER} ${reason}`);
        setStatus(`Zoom connection lost: ${reason}`);
      }

      // The backend can hang too, and a fetch has no deadline of its own. A
      // slow backend is not a dead Zoom connection, so this does not count
      // toward sdkHealth; it only keeps the loop moving.
      const botFetchTimeoutMs = 20000;

      async function botFetch(path, options) {
        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), botFetchTimeoutMs) : null;
        let response;
        try {
          response = await fetch(`${config.functionBaseUrl}${path}`, {
            ...(options || {}),
            ...(controller ? { signal: controller.signal } : {}),
            headers: {
              'x-bot-key': config.botKey,
              ...((options && options.body) ? { 'content-type': 'application/json' } : {}),
              ...((options && options.headers) || {}),
            },
          });
        } catch (error) {
          if (error && error.name === 'AbortError') {
            throw new Error(`Backend ${path.split('?')[0]} got no answer in ${botFetchTimeoutMs / 1000}s`);
          }
          throw error;
        } finally {
          if (timer) clearTimeout(timer);
        }
        const body = await response.json().catch(() => ({}));
        if (!response.ok || body.success === false) {
          const error = new Error(body.error || `HTTP ${response.status}`);
          error.status = response.status;
          throw error;
        }
        return body;
      }

      async function postState(status, extra) {
        const body = {
          hubDocId: config.hubDocId,
          status,
          boIdByRoomName: lastBoIdByRoomName,
          stats: {
            lane: config.lane,
            controllerVersion,
            roomCount: config.rooms.length,
            roomsOpened,
            joined,
            ...(extra && extra.stats ? extra.stats : {}),
          },
          error: extra && extra.error ? String(extra.error) : null,
          error_detail: extra && extra.error ? serializeError(extra.error) : null,
        };
        if (Object.prototype.hasOwnProperty.call(extra || {}, 'liveParticipantsByShift')) {
          body.liveParticipantsByShift = extra.liveParticipantsByShift || {};
        }
        // Who we were moving at this moment. The server compares one report of
        // each room with the last to see who dropped out, and somebody we moved
        // ourselves must not be recorded as their own connection failing.
        if (Object.prototype.hasOwnProperty.call(extra || {}, 'routedUids')) {
          body.routedUids = extra.routedUids || [];
        }
        try {
          await botFetch('/zoomHubBotState', {
            method: 'POST',
            body: JSON.stringify(body),
          });
          if (!firstStateAcceptedAt) firstStateAcceptedAt = Date.now();
        } catch (error) {
          // A hub that no longer exists is a normal ending, not a fault: node
          // drops this session on its next poll because the hub is gone from
          // its directives. Throwing here would break the routing tick and
          // leave the page looking frozen for the couple of seconds it has
          // left to live.
          if (error && error.status === 404) {
            console.log('Hub no longer exists; this session is ending.');
            return;
          }
          throw error;
        }
      }

      async function getAssignments() {
        return botFetch(`/zoomHubBotAssignments?hubDocId=${encodeURIComponent(config.hubDocId)}`);
      }

      function normalizeBreakoutPayload(payload) {
        const rooms = routing.normalizeRooms(payload);
        const unassigned = routing.normalizeUnassigned(payload);
        return { rooms, unassigned };
      }

      function buildBoIdMap(rooms) {
        const map = {};
        for (const room of rooms || []) {
          const name = routing.roomName(room);
          const boId = routing.roomId(room);
          if (name && boId) map[name] = boId;
        }
        return map;
      }

      function rememberLiveRooms(rooms) {
        const map = buildBoIdMap(rooms);
        if (Object.keys(map).length > 0) {
          liveBoIdByRoomName = map;
          lastBoIdByRoomName = map;
        }
        return map;
      }

      function summarizeRoom(room) {
        if (!room || typeof room !== 'object') return {};
        const participants = routing.roomParticipants(room);
        return {
          name: routing.roomName(room),
          id: routing.roomId(room),
          idFields: Object.fromEntries(
            ['boId', 'boID', 'boid', 'bo_id', 'roomId', 'roomID', 'room_id', 'breakoutRoomId', 'breakout_room_id', 'id']
              .filter((key) => room[key] !== undefined && room[key] !== null && room[key] !== '')
              .map((key) => [key, String(room[key])]),
          ),
          participantCount: participants.length,
        };
      }

      function summarizeParticipant(participant) {
        if (!participant || typeof participant !== 'object') return {};
        return {
          uid: routing.zoomCustomerKey(participant),
          userId: routing.zoomUserId(participant),
          name: String(participant.userName || participant.user_name || participant.displayName || participant.display_name || '').trim(),
          keys: Object.keys(participant).slice(0, 20),
        };
      }

      function participantIsHubBot(participant) {
        const uid = String(routing.zoomCustomerKey(participant) || '').trim().toLowerCase();
        if (uid.indexOf('zoom_hub_bot') === 0) return true;
        if (participant && (participant.isHost === true || participant.is_host === true || participant.isBotUser === true || participant.is_bot_user === true)) {
          return true;
        }
        const name = routing.normalizeRoomName(routing.zoomDisplayName(participant));
        return name.indexOf('hub bot') !== -1 || name.indexOf('alluwal hub') !== -1;
      }

      function participantRoutingKey(participant) {
        const userId = routing.zoomUserId(participant);
        if (userId === null || userId === undefined || userId === '') return '';
        return String(userId);
      }

      function actionRoutingKey(action) {
        const userId = action?.userId;
        if (userId === null || userId === undefined || userId === '') return '';
        return String(userId);
      }

      function trackAssignedNotJoined(actions, zoomState, now) {
        const breakoutUnassignedKeys = new Set(
          (zoomState.breakoutUnassigned || [])
            .filter((participant) => !participantIsHubBot(participant))
            .map(participantRoutingKey)
            .filter(Boolean),
        );
        const currentKeys = new Set();
        for (const action of actions) {
          if (action.action !== 'assign') continue;
          const key = actionRoutingKey(action);
          if (!key || !breakoutUnassignedKeys.has(key)) continue;
          currentKeys.add(key);
          if (!assignedNotJoinedByParticipant.has(key)) {
            assignedNotJoinedByParticipant.set(key, { since: now, repairAttempts: 0 });
          }
        }
        for (const key of assignedNotJoinedByParticipant.keys()) {
          if (!currentKeys.has(key)) assignedNotJoinedByParticipant.delete(key);
        }
        if (currentKeys.size === 0) assignedNotJoinedRepairAttempts = 0;
        const waits = Array.from(assignedNotJoinedByParticipant.values());
        return {
          count: waits.length,
          oldestMs: waits.length > 0
            ? Math.max(...waits.map((wait) => Math.max(0, now - wait.since)))
            : 0,
        };
      }

      async function requestAssignedNotJoinedReset({ zoomState, liveRoomCount, assignedNotJoined }) {
        if (resetRequested) return;
        resetRequested = true;
        console.error(
          `Self-heal exhausted: ${assignedNotJoined.count} assigned participant(s) still did not enter; requesting a clean meeting`,
        );
        await postState('resetMeeting', {
          stats: {
            liveRoomCount,
            inRoomOccupants: 0,
            breakoutUnassignedCount: (zoomState.breakoutUnassigned || []).length,
            assignedNotJoinedCount: assignedNotJoined.count,
            oldestAssignedNotJoinedMs: assignedNotJoined.oldestMs,
          },
        }).catch((error) => console.warn('assigned-not-joined resetMeeting request failed', error));
        triggerRejoin('assigned_not_joined');
      }

      function buildLiveParticipantsByShift(assignments, zoomState) {
        const rooms = Array.isArray(assignments?.rooms) ? assignments.rooms : [];
        const members = Array.isArray(assignments?.members) ? assignments.members : [];
        const shiftByRoomName = new Map();
        for (const room of rooms) {
          const shiftId = String(room?.shiftId || room?.shift_id || '').trim();
          const roomName = routing.normalizeRoomName(room?.name);
          if (shiftId && roomName) shiftByRoomName.set(roomName, shiftId);
        }

        const memberByRoutingUid = new Map();
        for (const member of members) {
          const uid = String(member?.uid || '').trim();
          if (uid) memberByRoutingUid.set(uid, member);
        }
        const memberByAlias = routing.indexMembersByAlias(members);

        const liveByShift = {};
        const seen = new Set();
        for (const room of Array.isArray(zoomState?.rooms) ? zoomState.rooms : []) {
          const roomName = routing.normalizeRoomName(routing.roomName(room));
          const shiftId = shiftByRoomName.get(roomName);
          if (!shiftId) continue;
          for (const participant of routing.roomParticipants(room)) {
            if (participantIsHubBot(participant)) continue;
            const routingUid = String(routing.zoomCustomerKey(participant) || '').trim();
            const name = String(routing.zoomDisplayName(participant) || '').trim();
            const member = (routingUid && memberByRoutingUid.get(routingUid)) ||
              (name && memberByAlias.get(routing.normalizeRoomName(name))) ||
              null;
            const identity = String(member?.userId || member?.user_id || '').trim();
            const role = String(member?.role || 'participant').trim() || 'participant';
            const key = `${shiftId}:${identity || routingUid || name || routing.zoomUserId(participant)}`;
            if (seen.has(key)) continue;
            seen.add(key);
            if (!liveByShift[shiftId]) liveByShift[shiftId] = [];
            liveByShift[shiftId].push({
              identity,
              routingUid,
              zoomUserId: routing.zoomUserId(participant),
              // The member's own name wins over the one Zoom reports. A teacher
              // handed to the desktop app joins under the routing name, which
              // carries a routing token — plumbing, and not something to show
              // an administrator reading a list of people.
              name: String(
                member?.realDisplayName || member?.real_display_name ||
                member?.displayName || member?.display_name || '',
              ).trim() || name || 'Participant',
              role,
              source: 'zoom_hub_bot',
            });
          }
        }
        return liveByShift;
      }

      function summarizeBreakoutPayload(payload, normalized) {
        const result = payload && typeof payload === 'object' && payload.result && typeof payload.result === 'object'
          ? payload.result
          : {};
        return {
          topKeys: payload && typeof payload === 'object' ? Object.keys(payload).slice(0, 20) : [],
          resultKeys: Object.keys(result).slice(0, 30),
          roomCount: normalized.rooms.length,
          breakoutUnassigned: normalized.unassigned.map(summarizeParticipant),
        };
      }

      function roomsFromLiveBoIds(assignments) {
        const rooms = [];
        const assignedRooms = Array.isArray(assignments?.rooms) ? assignments.rooms : [];
        for (const room of assignedRooms) {
          const name = String(room?.name || '').trim();
          const boId = liveBoIdByRoomName[name];
          if (name && boId) rooms.push({ name, boId, participants: [] });
        }
        return rooms;
      }

      function roomsWithStoredBoIds(rooms) {
        return (Array.isArray(rooms) ? rooms : []).map((room) => {
          if (routing.roomId(room)) return room;
          const name = routing.roomName(room);
          const boId = lastBoIdByRoomName[name];
          return name && boId ? { ...room, boId } : room;
        });
      }

      function isVisibleElement(element) {
        if (!element || !element.getBoundingClientRect) return false;
        const rect = element.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return false;
        const style = window.getComputedStyle(element);
        return style.visibility !== 'hidden' && style.display !== 'none' && Number(style.opacity || 1) > 0;
      }

      function controlText(element) {
        return [
          element?.innerText,
          element?.textContent,
          element?.getAttribute?.('aria-label'),
          element?.getAttribute?.('title'),
        ].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
      }

      function clickZoomControl(matcher, options = {}) {
        const blocked = options.blocked || /\b(close all|end meeting|end for all|leave meeting|leave room)\b/i;
        const nodes = Array.from(document.querySelectorAll(
          'button,[role="button"],a,li,[aria-label],[title],.footer-button-base__button',
        ));
        for (const node of nodes) {
          if (!isVisibleElement(node)) continue;
          const text = controlText(node);
          if (!text || blocked.test(text) || !matcher.test(text)) continue;
          const target = node.closest('button,[role="button"],a,li') || node;
          if (!isVisibleElement(target)) continue;
          target.click();
          return text;
        }
        return '';
      }

      async function primeBreakoutUi(reason) {
        let clicked = clickZoomControl(/\bbreakout\s*rooms?\b/i);
        if (!clicked) {
          const more = clickZoomControl(/^\s*more\s*$/i, { blocked: /\b(end meeting|leave meeting)\b/i });
          if (more) {
            await sleep(500);
            clicked = clickZoomControl(/\bbreakout\s*rooms?\b/i);
          }
        }
        if (clicked) {
          console.log('Breakout UI prime', JSON.stringify({ reason, clicked }));
          await sleep(1200);
          return true;
        }
        console.warn('Breakout UI prime did not find a control', reason);
        await sleep(300);
        return false;
      }

      async function readBreakoutState() {
        const breakoutPayload = await zoomCall('getBreakoutRooms');
        const attendeesPayload = await zoomCall('getAttendeeslist').catch(() => []);
        const normalized = normalizeBreakoutPayload(breakoutPayload);
        rememberLiveRooms(normalized.rooms);
        if (normalized.rooms.length > 0) {
          haveReadRoomsThisSession = true;
          lastReadableRoomsAt = Date.now();
          lastKnownInRoomCount = normalized.rooms.reduce(
            (sum, room) => sum + routing.roomParticipants(room).length,
            0,
          );
        }
        // People in rooms raise the bar for calling the connection dead.
        sdkHealth.setOccupied(lastKnownInRoomCount > 0);
        const attendeeList = Array.isArray(attendeesPayload)
          ? attendeesPayload
          : routing.normalizeUnassigned(attendeesPayload);
        const breakoutUnassigned = normalized.unassigned;
        const assignedUids = new Set();
        for (const room of normalized.rooms) {
          for (const participant of routing.roomParticipants(room)) {
            const uid = routing.zoomCustomerKey(participant);
            if (uid) assignedUids.add(uid);
          }
        }
        const unassignedByParticipant = new Map();
        for (const participant of normalized.unassigned) {
          const uid = routing.zoomCustomerKey(participant);
          const userId = routing.zoomUserId(participant);
          const key = uid && userId !== null ? `${uid}:${String(userId)}` : uid;
          if (uid && key) unassignedByParticipant.set(key, participant);
        }
        for (const participant of attendeeList) {
          const uid = routing.zoomCustomerKey(participant);
          const userId = routing.zoomUserId(participant);
          const key = uid && userId !== null ? `${uid}:${String(userId)}` : uid;
          if (uid && key && !assignedUids.has(uid) && !unassignedByParticipant.has(key)) {
            unassignedByParticipant.set(key, participant);
          }
        }
        return {
          rooms: normalized.rooms,
          unassigned: Array.from(unassignedByParticipant.values()),
          breakoutUnassigned,
          attendeeList,
          breakoutPayloadSummary: summarizeBreakoutPayload(breakoutPayload, normalized),
        };
      }

      async function getBreakoutState(options = {}) {
        const state = await readBreakoutState();
        if (state.rooms.length > 0 || !options.primeIfEmpty) return state;
        await primeBreakoutUi(options.reason || 'empty_rooms');
        return readBreakoutState();
      }

      // The SDK's breakout list can read empty transiently. Before any
      // destructive close+reopen we retry the read hard: if it becomes readable
      // we both avoid an unnecessary reopen AND learn true occupancy (which
      // updates lastKnownInRoomCount and protects a live class from being reopened).
      async function burstReadBreakoutRooms(maxTries = 8) {
        let state = await readBreakoutState();
        for (let i = 0; i < maxTries && state.rooms.length === 0; i += 1) {
          await sleep(1000);
          state = await readBreakoutState();
        }
        return state;
      }

      function isInvalidOperation(error) {
        const text = JSON.stringify(error || {}).toLowerCase();
        return text.includes('invalid_operation') || text.includes('already') || text.includes('started');
      }

      function breakoutStatusValue(payload) {
        if (typeof payload === 'number') return payload;
        if (!payload || typeof payload !== 'object') return null;
        // Zoom wraps responses as {status: <success boolean>, result: <value>}
        // — the boolean is NOT the room status, so only trust numeric fields.
        const candidates = [
          typeof payload.status === 'number' ? payload.status : undefined,
          typeof payload.result === 'number' ? payload.result : undefined,
          payload.result && typeof payload.result === 'object'
            ? payload.result.status ?? payload.result.value
            : undefined,
          typeof payload.value === 'number' ? payload.value : undefined,
        ];
        for (const raw of candidates) {
          const number = Number(raw);
          if (Number.isFinite(number)) return number;
          if (typeof raw === 'string') {
            const text = raw.toLowerCase();
            if (text.includes('progress') || text.includes('started') || text.includes('open')) return 2;
            if (text.includes('closed') || text.includes('not started')) return 4;
          }
        }
        return null;
      }

      const desiredRoomOptions = {
        isAutoJoinRoom: true,
        isBackToMainSessionEnabled: false,
        isTimerEnabled: false,
        needCountDown: false,
      };

      function unwrapResult(payload) {
        if (payload && typeof payload === 'object' && payload.result && typeof payload.result === 'object') {
          return payload.result;
        }
        return payload && typeof payload === 'object' ? payload : {};
      }

      // Breakout options freeze at the FIRST openBreakoutRooms and cannot be
      // changed while rooms are open. Unreadable options count as mismatched:
      // stale options (invitation mode instead of auto-pull) are exactly the
      // failure we cannot detect any other way.
      function roomOptionsMismatch(rawOptions) {
        const options = unwrapResult(rawOptions);
        if (typeof options.isAutoJoinRoom !== 'boolean') return true;
        return options.isAutoJoinRoom !== desiredRoomOptions.isAutoJoinRoom ||
          options.isBackToMainSessionEnabled !== desiredRoomOptions.isBackToMainSessionEnabled;
      }

      function inRoomParticipantCount(state) {
        return (state.rooms || []).reduce(
          (sum, room) => sum + routing.roomParticipants(room).length,
          0,
        );
      }

      function nonBotAttendeeCount(state) {
        const botUid = `zoom_hub_bot_lane_${config.lane}`;
        const attendees = state?.attendeeList && state.attendeeList.length > 0
          ? state.attendeeList
          : state?.unassigned || [];
        const seen = new Set();
        for (const participant of attendees) {
          const uid = routing.zoomCustomerKey(participant);
          const userId = routing.zoomUserId(participant);
          const key = uid || String(userId || '');
          if (!key || key === botUid || seen.has(key)) continue;
          seen.add(key);
        }
        return seen.size;
      }

      // Safe to close+reopen rooms only when nobody is inside a room. A person
      // waiting in the MAIN session is fine to reopen around — closing breakout
      // rooms never affects them. We refuse to reopen when occupancy is unknown
      // (rooms we inherited from a previous session and have never read) so a
      // bot restart during a live class can never bump students out of rooms.
      // Reopen is safe unless there is POSITIVE evidence someone is inside a
      // room: either a live readable snapshot shows in-room participants, or the
      // last time we could read the list it showed occupants. When the list is
      // simply unreadable (empty) and we have no such evidence — the common
      // failure — reopening restores routing, and any assigned user who was
      // briefly in a room is auto-pulled back on reopen (isAutoJoinRoom). Callers
      // must burst-read first so a busy/warm hub reports its real occupancy here.
      function isSafeToReopen(state) {
        if (state && inRoomParticipantCount(state) > 0) return false;
        if (lastKnownInRoomCount > 0) return false;
        return true;
      }

      async function currentBreakoutStatus() {
        const status = await zoomCall('getBreakoutRoomStatus').catch(() => null);
        return breakoutStatusValue(status);
      }

      async function waitForRoomsClosed(timeoutMs = 90000) {
        const startedAt = Date.now();
        while (Date.now() - startedAt < timeoutMs) {
          const status = await currentBreakoutStatus();
          if (status !== 2 && status !== 3) return true;
          await sleep(2000);
        }
        return false;
      }

      // Returns true when it closed stale rooms (caller should retry a fresh
      // create+open pass). Never closes occupied rooms.
      async function closeRoomsIfStale(breakoutState) {
        const options = await zoomCall('getBreakoutRoomOptions').catch(() => null);
        console.log('BO options payload', JSON.stringify(options));
        if (!roomOptionsMismatch(options)) return false;
        if (inRoomParticipantCount(breakoutState) > 0) {
          console.error(
            'Breakout options are stale but rooms are occupied; not reopening',
            unwrapResult(options),
          );
          await postState('error', { error: 'stale_breakout_options_with_occupants' })
            .catch(() => {});
          return false;
        }
        setStatus('Reopening rooms: stale breakout options detected');
        await zoomCall('closeBreakoutRooms')
          .catch((error) => console.warn('closeBreakoutRooms failed', error));
        await waitForRoomsClosed();
        return true;
      }

      async function ensureRoomsOpen() {
        let breakoutState = await getBreakoutState();

        for (let attempt = 0; attempt < 2; attempt += 1) {
          const statusPayload = await zoomCall('getBreakoutRoomStatus').catch(() => null);
          console.log('BO status payload', JSON.stringify(statusPayload));
          const inProgress = breakoutStatusValue(statusPayload) === 2;
          const existingNames = new Set(
            breakoutState.rooms.map((room) => routing.normalizeRoomName(routing.roomName(room))).filter(Boolean),
          );
          const missingRooms = config.rooms.filter((name) => !existingNames.has(routing.normalizeRoomName(name)));

          if (inProgress) {
            if (
              breakoutState.rooms.length === 0 &&
              Object.keys(lastBoIdByRoomName).length > 0
            ) {
              // Try hard to read the inherited rooms before touching them; this
              // both avoids an unnecessary reopen and surfaces real occupancy.
              breakoutState = await burstReadBreakoutRooms();
              if (breakoutState.rooms.length > 0) {
                continue;
              }
              if (isSafeToReopen(breakoutState)) {
                setStatus('Reopening rooms: current bot cannot read existing rooms');
                lastBoIdByRoomName = {};
                liveBoIdByRoomName = {};
                await zoomCall('closeBreakoutRooms')
                  .catch((error) => console.warn('closeBreakoutRooms failed', error));
                await waitForRoomsClosed();
                breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_close_unreadable' });
                continue;
              }
              console.error('Breakout rooms are unreadable and in-room occupancy is detected; not reopening to protect a live class');
              await postState('error', { error: 'breakout_rooms_unreadable_occupancy_detected' })
                .catch(() => {});
              break;
            }
            if (missingRooms.length > 0) {
              try {
                setStatus(`Adding ${missingRooms.length} breakout rooms`);
                const createdPayload = await zoomCall('createBreakoutRoom', { data: missingRooms, pattern: 2 });
                const createdRooms = routing.normalizeRooms(createdPayload);
                rememberLiveRooms(createdRooms);
                console.log('Add breakout rooms payload', JSON.stringify({
                  roomCount: createdRooms.length,
                  rooms: createdRooms.map(summarizeRoom),
                }));
                breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_add_live_rooms' });
              } catch (error) {
                console.warn('Live room creation rejected; continuing with current rooms', error);
                await postState('error', { error: `live_room_creation_failed:${serializeError(error)}` })
                  .catch(() => {});
              }
            }
            if (attempt === 0 && await closeRoomsIfStale(breakoutState)) {
              breakoutState = await getBreakoutState();
              continue;
            }
            break;
          }

          if (missingRooms.length > 0) {
            try {
              setStatus(`Creating ${missingRooms.length} breakout rooms`);
              const createdPayload = await zoomCall('createBreakoutRoom', { data: missingRooms, pattern: 2 });
              const createdRooms = routing.normalizeRooms(createdPayload);
              rememberLiveRooms(createdRooms);
              // We created the room set this session, so no prior occupants can
              // be inside — safe for the self-heal to close+reopen if needed.
              roomsCreatedFresh = true;
              console.log('Create breakout rooms payload', JSON.stringify({
                roomCount: createdRooms.length,
                rooms: createdRooms.map(summarizeRoom),
              }));
            } catch (error) {
              if (!isInvalidOperation(error)) throw error;
              console.warn('Room creation rejected; continuing to open step', error);
            }
            breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_create' });
          }

          setStatus('Opening breakout rooms');
          try {
            const openPayload = await zoomCall('openBreakoutRooms', { options: desiredRoomOptions });
            console.log('Open breakout rooms payload', JSON.stringify(openPayload));
          } catch (error) {
            if (!isInvalidOperation(error)) throw error;
            console.warn('Rooms already open', error);
          }
          await sleep(1500);
          breakoutState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_open' });

          // A successful open response does not prove Zoom applied auto-join.
          // Verify the effective options after every first open, including a
          // fresh meeting, and close+reopen once if Zoom froze stale options.
          if (attempt === 0 && await closeRoomsIfStale(breakoutState)) {
            breakoutState = await getBreakoutState();
            continue;
          }
          break;
        }

        rememberLiveRooms(breakoutState.rooms);
        roomsOpened = true;
        // Healthy open — clear the reload cap so future transient rejoins over a
        // long healthy session are not counted against it.
        try { window.sessionStorage.setItem('alluwal_rejoin_count', '0'); } catch (_) {}
        await postState('roomsOpen');
        setStatus(`Rooms open for ${config.hubDocId}`);
      }

      async function routeOnce() {
        const assignments = await getAssignments();
        // Backend force-rejoin signal (zombie meeting detected server-side):
        // reload into a fresh instance. Only when nobody is inside a room.
        const forceRejoinAt = Number(assignments && assignments.forceRejoinAt);
        // The watchdog stamps this when it last saw a stale heartbeat. A stamp
        // landing within ~90s of this page's first report was decided on the
        // silence BEFORE this page joined — on 2026-11-20 lane 3 opened its
        // rooms after a recycle and then reloaded and opened them again for
        // exactly that reason. A real zombie is stamped again after the
        // watchdog's 3-minute throttle, and that one is acted on.
        const stampPredatesThisPage = firstStateAcceptedAt > 0 &&
          forceRejoinAt < firstStateAcceptedAt + forceRejoinSettleMs;
        if (Number.isFinite(forceRejoinAt) && forceRejoinAt > pageLoadedAt && !stampPredatesThisPage) {
          const currentState = await readBreakoutState().catch(() => null);
          const inRoom = currentState ? inRoomParticipantCount(currentState) : 0;
          if (inRoom === 0) {
            triggerRejoin('backend_force_rejoin');
            return;
          }
        }
        let zoomState = await getBreakoutState({ primeIfEmpty: true, reason: 'route_once' });
        rememberLiveRooms(zoomState.rooms);

        // Self-heal: if the SDK's live breakout list is empty while routing is
        // actually needed, the bot cannot assign anyone (assignUserToBreakoutRoom
        // rejects every target as "room id not found"). Repair by re-running the
        // open/recovery path, which restores a readable room list. Gated so it
        // never closes rooms that could hold a live class (isSafeToReopen) and
        // throttled so it does not thrash.
        const liveRoomCount = (zoomState.breakoutPayloadSummary || {}).roomCount || 0;
        const botUid = `zoom_hub_bot_lane_${config.lane}`;
        const waitingPeople = (zoomState.unassigned || []).some((participant) => {
          const uid = routing.zoomCustomerKey(participant);
          return uid && uid !== botUid;
        });
        const membersExpected = Array.isArray(assignments.members) && assignments.members.length > 0;
        if (
          liveRoomCount === 0 &&
          config.rooms.length > 0 &&
          (waitingPeople || membersExpected) &&
          Date.now() - lastHealAttemptAt > healThrottleMs
        ) {
          lastHealAttemptAt = Date.now();
          zoomState = await burstReadBreakoutRooms();
          rememberLiveRooms(zoomState.rooms);
          const recoveredRoomCount = (zoomState.breakoutPayloadSummary || {}).roomCount || 0;
          if (recoveredRoomCount > 0) {
            console.log('Self-heal: breakout room list recovered via burst read; no reopen needed');
            consecutiveHealFailures = 0;
          } else if (isSafeToReopen(zoomState)) {
            console.warn('Self-heal: breakout room list still empty after burst read; reopening rooms');
            await ensureRoomsOpen().catch((error) => console.warn('Self-heal ensureRoomsOpen failed', error));
            zoomState = await getBreakoutState({ primeIfEmpty: true, reason: 'after_self_heal' });
            rememberLiveRooms(zoomState.rooms);
            const afterReopenRoomCount = (zoomState.breakoutPayloadSummary || {}).roomCount || 0;
            if (afterReopenRoomCount > 0) {
              consecutiveHealFailures = 0;
            } else {
              consecutiveHealFailures += 1;
              console.warn(`Self-heal: reopen did not restore rooms (${consecutiveHealFailures}/${healFailuresBeforeReset})`);
              // The meeting instance is corrupted beyond in-place repair. Ask the
              // backend to end it, then leave; the directive poll rejoins a fresh
              // instance. Guarded by isSafeToReopen (no one inside a room).
              if (consecutiveHealFailures >= healFailuresBeforeReset && !resetRequested) {
                resetRequested = true;
                console.error('Self-heal exhausted; requesting meeting reset for a clean rejoin');
                // Ask the backend to end the (corrupted) meeting, then reload to
                // rejoin a fresh instance. Reloading is self-contained and does
                // not depend on the launcher re-opening the page.
                await postState('resetMeeting', {
                  stats: { liveRoomCount: 0, inRoomOccupants: inRoomParticipantCount(zoomState) },
                }).catch((error) => console.warn('resetMeeting request failed', error));
                triggerRejoin('self_heal_exhausted');
                return;
              }
            }
          } else {
            console.warn('Self-heal skipped: in-room participants detected; not reopening to protect a live class');
            consecutiveHealFailures = 0;
          }
        }

        if (zoomState.rooms.length === 0 && Object.keys(liveBoIdByRoomName).length > 0) {
          zoomState.rooms = roomsFromLiveBoIds(assignments);
        } else if (zoomState.rooms.length > 0 && Object.keys(lastBoIdByRoomName).length > 0) {
          zoomState.rooms = roomsWithStoredBoIds(zoomState.rooms);
        }
        const actions = routing.whoNeedsToMoveWhere(assignments, zoomState);
        const now = Date.now();
        const assignedNotJoined = trackAssignedNotJoined(actions, zoomState, now);
        if (
          assignedNotJoined.count > 0 &&
          assignedNotJoined.oldestMs >= assignedNotJoinedThresholdMs
        ) {
          const inRoom = inRoomParticipantCount(zoomState);
          if (inRoom === 0 && lastKnownInRoomCount === 0) {
            if (assignedNotJoinedRepairAttempts === 0) {
              assignedNotJoinedRepairAttempts = 1;
              for (const wait of assignedNotJoinedByParticipant.values()) {
                wait.since = now;
                wait.repairAttempts += 1;
              }
              console.warn(
                `Self-heal: ${assignedNotJoined.count} assigned participant(s) did not enter a room; reopening breakout rooms`,
              );
              await zoomCall('closeBreakoutRooms')
                .catch((error) => console.warn('assigned-not-joined closeBreakoutRooms failed', error));
              const roomsClosed = await waitForRoomsClosed(15000);
              if (!roomsClosed) {
                console.error('Assigned-not-joined repair could not close rooms; replacing the empty meeting');
                await requestAssignedNotJoinedReset({
                  zoomState,
                  liveRoomCount,
                  assignedNotJoined,
                });
                return;
              }
              await ensureRoomsOpen()
                .catch((error) => console.warn('assigned-not-joined ensureRoomsOpen failed', error));
              return;
            }
            await requestAssignedNotJoinedReset({
              zoomState,
              liveRoomCount,
              assignedNotJoined,
            });
            return;
          } else {
            console.error(
              `Assigned participants are not entering rooms, but ${Math.max(inRoom, lastKnownInRoomCount)} participant(s) are already inside; refusing to reset`,
            );
          }
        }
        if (now - lastRoutingSnapshotLogAt > 15000 || actions.length > 0) {
          lastRoutingSnapshotLogAt = now;
          console.log('Routing snapshot', JSON.stringify({
            rooms: zoomState.rooms.map(summarizeRoom),
            unassigned: zoomState.unassigned.map((participant) => ({
              uid: routing.zoomCustomerKey(participant),
              userId: routing.zoomUserId(participant),
            })),
            breakoutUnassigned: (zoomState.breakoutUnassigned || []).map(summarizeParticipant),
            attendeeList: (zoomState.attendeeList || []).map(summarizeParticipant),
            breakoutPayload: zoomState.breakoutPayloadSummary || null,
            actions: actions.map((action) => ({
              uid: action.uid,
              userId: action.userId,
              action: action.action,
              targetRoomName: action.targetRoomName,
              targetRoomId: action.targetRoomId,
            })),
          }));
        }
        const participants = [
          ...zoomState.unassigned,
          ...zoomState.rooms.flatMap((room) => routing.roomParticipants(room)),
        ];
        for (const action of actions) {
          const method = action.action === 'move'
            ? 'moveUserToBreakoutRoom'
            : 'assignUserToBreakoutRoom';
          await zoomCall(method, {
            userId: action.userId,
            targetRoomId: action.targetRoomId,
          }).catch((error) => {
            console.warn(`${method} failed for ${action.uid}`, error);
          });
          if (action.action === 'assign') {
            await sleep(250);
            await zoomCall('moveUserToBreakoutRoom', {
              userId: action.userId,
              targetRoomId: action.targetRoomId,
            }).catch((error) => {
              console.warn(`moveUserToBreakoutRoom after assign failed for ${action.uid}`, error);
            });
          }
        }
        await postState('roomsOpen', {
          liveParticipantsByShift: buildLiveParticipantsByShift(assignments, zoomState),
          routedUids: actions.map((action) => action.uid).filter(Boolean),
          stats: {
            routedCount: actions.length,
            routeAttemptCount: actions.length,
            confirmedInRoomCount: inRoomParticipantCount(zoomState),
            breakoutUnassignedCount: (zoomState.breakoutUnassigned || []).filter(
              (participant) => !participantIsHubBot(participant),
            ).length,
            assignedNotJoinedCount: assignedNotJoined.count,
            oldestAssignedNotJoinedMs: assignedNotJoined.oldestMs,
            attendeeCount: zoomState.unassigned.length + zoomState.rooms.reduce((sum, room) => (
              sum + routing.roomParticipants(room).length
            ), 0),
            customerKeyCount: participants.filter((participant) => routing.zoomCustomerKey(participant)).length,
            routableRoomCount: zoomState.rooms.filter((room) => routing.roomId(room)).length,
            targetMemberCount: Array.isArray(assignments.members) ? assignments.members.length : 0,
            // liveRoomCount is the real getBreakoutRooms() reading. When it is 0
            // while rooms should be open and members are expected, the meeting
            // instance's breakout state is corrupted and the bot cannot route.
            // The server-side watcher ends+resets such a meeting so the bot can
            // rejoin a clean instance. inRoomOccupants lets the watcher confirm
            // no live class would be disrupted before it resets.
            liveRoomCount: (zoomState.breakoutPayloadSummary || {}).roomCount || 0,
            inRoomOccupants: Math.max(inRoomParticipantCount(zoomState), lastKnownInRoomCount),
          },
        });
      }

      function shouldLeave() {
        if (!config.windowEnd) return false;
        const end = new Date(config.windowEnd).getTime();
        return Number.isFinite(end) && Date.now() > end;
      }

      async function leaveMeeting() {
        if (leaving) return;
        leaving = true;
        await postState('left').catch(() => {});
        if (window.ZoomMtg && typeof window.ZoomMtg.leaveMeeting === 'function') {
          await zoomCall('leaveMeeting').catch(() => {});
        }
      }

      async function routingLoop() {
        let lastHeartbeat = 0;
        while (!leaving && !connectionDead) {
          if (shouldLeave()) {
            await leaveMeeting();
            return;
          }
          try {
            await routeOnce();
            const now = Date.now();
            if (now - lastHeartbeat > heartbeatIntervalMs) {
              await postState('roomsOpen');
              lastHeartbeat = now;
            }
          } catch (error) {
            if (connectionDead) return;
            console.error('Routing loop failed', error);
            await postState('error', { error }).catch(() => {});
          }
          await sleep(routeIntervalMs);
        }
      }

      const JOIN_REFUSED_MARKER = 'Zoom join refused:';
      const oldHostPollMs = 3000;

      function attendeeListOf(payload) {
        const result = payload && payload.result ? payload.result : payload;
        const list = result && (result.attendeesList || result.attendeeList || result.attendees);
        return Array.isArray(list) ? list : (Array.isArray(result) ? result : []);
      }

      // Who this page is in the meeting, and whether an older session of the
      // same bot is still there with it.
      async function hostSessionView() {
        const current = await zoomCall('getCurrentUser', {}, 10000).catch(() => null);
        const self = (current && current.result && current.result.currentUser) || null;
        const attendees = attendeeListOf(await zoomCall('getAttendeeslist', {}, 10000).catch(() => null));
        const botUid = `zoom_hub_bot_lane_${config.lane}`;
        const botName = routing.normalizeRoomName(`Alluwal Hub Bot Lane ${config.lane}`);
        const selfId = self ? String(self.userId) : '';
        const others = attendees.filter((person) => String(routing.zoomUserId(person)) !== selfId);
        const oldSessions = others.filter((person) => (
          String(routing.zoomCustomerKey(person) || '') === botUid ||
          routing.normalizeRoomName(routing.zoomDisplayName(person)) === botName
        ));
        const otherHosts = others.filter((person) => person && (person.isHost === true || person.is_host === true));
        return {
          known: Boolean(self),
          isHost: Boolean(self && (self.isHost === true || self.is_host === true)),
          oldSessions: oldSessions.map((person) => String(routing.zoomUserId(person))),
          otherHosts: otherHosts.map((person) => String(routing.zoomUserId(person))),
          attendeeCount: attendees.length,
        };
      }

      // A recycled page leaves its host session behind in Zoom, and Zoom keeps
      // it — as the host — for two to three minutes (measured 2026-11-23: 90s
      // after a cut connection, ~175s after a plain stop). A page that joins
      // meanwhile gets in, but as an ordinary participant: it cannot open rooms
      // or move anybody, and opening rooms around a second host is what gave
      // the conflicting room operations behind the old fixed 150s wait.
      //
      // So the rejoined page keeps its rooms shut until it is the only host.
      // It is the account's own original host, so it can take the host role
      // back from the dead session itself (ZoomMtg.reclaimHost) instead of
      // waiting for Zoom to time that session out. It gives up waiting at the
      // same 150s cap. A first join with nobody left behind passes straight
      // through. The heartbeat keeps going so the watchdog does not read the
      // wait as a dead bot and order yet another rejoin.
      async function waitForOldHostSession() {
        const deadline = config.oldHostDeadline || (Date.now() + 150000);
        const startedAt = Date.now();
        let announced = false;
        let lastReclaimAt = 0;
        let lastBeatAt = Date.now();
        while (!connectionDead) {
          const view = await hostSessionView();
          const clear = view.known && view.isHost && view.otherHosts.length === 0;
          if (clear) {
            if (announced) {
              console.log('Host role confirmed', JSON.stringify({ waitedMs: Date.now() - startedAt, ...view }));
            }
            return true;
          }
          if (Date.now() >= deadline) {
            console.warn('Old host session still present at the cap; opening rooms anyway', JSON.stringify(view));
            return false;
          }
          if (!announced) {
            announced = true;
            console.warn('Waiting for the old host session to leave before opening rooms', JSON.stringify(view));
            setStatus('Waiting for the previous host session to leave');
          }
          // The SDK throttles this call to one per 5s.
          if (view.known && !view.isHost && Date.now() - lastReclaimAt > 6000) {
            lastReclaimAt = Date.now();
            await zoomCall('reclaimHost', {}, 10000)
              .then(() => console.log('Asked Zoom to hand the host role back from the old session'))
              .catch((error) => console.warn('reclaimHost failed', serializeError(error)));
          }
          if (Date.now() - lastBeatAt > heartbeatIntervalMs) {
            lastBeatAt = Date.now();
            await postState('joined', { stats: { waitingForOldHost: true } }).catch(() => {});
          }
          await sleep(oldHostPollMs);
        }
        return false;
      }

      function joinMeeting() {
        setStatus(`Joining hub ${config.hubDocId}`);
        window.ZoomMtg.setZoomJSLib(`https://source.zoom.us/${window.ZOOM_SDK_VERSION}/lib`, '/av');
        window.ZoomMtg.preLoadWasm();
        window.ZoomMtg.prepareWebSDK();
        window.ZoomMtg.i18n.load('en-US');
        window.ZoomMtg.i18n.reload('en-US');
        window.ZoomMtg.init({
          leaveUrl: 'about:blank',
          disableJoinAudio: true,
          disablePreview: true,
          disableCallOut: true,
          disableVoIP: true,
          isSupportAV: false,
          disableCORP: true,
          success: () => {
            window.ZoomMtg.join({
              sdkKey: config.sdkKey,
              signature: config.signature,
              meetingNumber: config.meetingNumber,
              passWord: config.password,
              userName: `Alluwal Hub Bot Lane ${config.lane}`,
              userEmail: config.hostAccount,
              customerKey: `zoom_hub_bot_lane_${config.lane}`,
              zak: config.zak,
              success: async () => {
                joined = true;
                setStatus('Joined as host');
                sdkHealth.arm();
                await postState('joined').catch(() => {});
                await waitForOldHostSession();
                if (connectionDead) return;
                await ensureRoomsOpen();
                routingLoop();
              },
              error: async (error) => {
                setStatus('Zoom join failed');
                // The SDK's join error carries the session's tokens (zsk, zak);
                // only the code and message go to the log and the hub doc.
                const joinError = {
                  method: 'join',
                  errorCode: error && error.errorCode,
                  errorMessage: error && error.errorMessage,
                };
                console.error('Zoom join failed detail', JSON.stringify(joinError));
                await postState('error', { error: joinError }).catch(() => {});
                // bot.js closes this page and tries again shortly. Nothing was
                // opened, so a refused join (errorCode 3000 while the lane's
                // previous host session is still in Zoom) costs a retry, never
                // a room reopen.
                console.warn(`${JOIN_REFUSED_MARKER} ${joinError.errorCode} ${String(joinError.errorMessage || '').slice(0, 120)}`);
              },
            });
          },
          error: async (error) => {
            setStatus('Zoom init failed');
            console.error('Zoom init failed detail', serializeError(error));
            await postState('error', { error }).catch(() => {});
            throw error;
          },
        });
      }

      joinMeeting();
    })();
  </script>
</body>
</html>
