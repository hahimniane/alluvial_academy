# The Zoom hub bots host live classes from inside a headless browser. When an
# unattended upgrade touches a library they link against (libc6 and python3.12
# on 2026-09-12), needrestart restarts them automatically — which closes every
# breakout room in progress and drops the classes inside, with no warning to
# the teacher and nothing in the alert trail to explain it.
#
# They are excluded here and restarted deliberately instead, by
# zoom-hub-bot-safe-restart.timer, which only acts when no hub is being hosted.
$nrconf{blacklist_rc} = [
    qr(^zoom-hub-bot@),
];
