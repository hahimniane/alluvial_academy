<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.2.0/css/bootstrap.css" crossorigin="anonymous" />
  <link type="text/css" rel="stylesheet" href="https://source.zoom.us/6.2.0/css/react-select.css" crossorigin="anonymous" />
  <style>
    html, body, #zmmtg-root { margin: 0; width: 100%; height: 100%; background: #000; }
    body { overflow: hidden; }
    /* Keep Zoom's Client View un-cropped. Do NOT force a z-index here:
       Zoom renders dropdown popups (More menu -> Whiteboards, Captions,
       Settings) in portals that can stack below an inflated #zmmtg-root
       z-index, which makes the More menu appear empty. */
    #zmmtg-root {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
    }
    body.alluwal-private-routing-pending #zmmtg-root {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      z-index: 2147483647;
      pointer-events: none;
    }
    body.alluwal-private-routing-pending #status {
      pointer-events: auto;
    }
    #status.status-toast {
      inset: 16px auto auto 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 32px);
      min-height: 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.86);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
      font-size: 13px;
      line-height: 1.3;
    }
    #leaveMeetingButton {
      position: fixed;
      right: 18px;
      top: calc(18px + env(safe-area-inset-top, 0px));
      z-index: 2147483647;
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      max-width: calc(100vw - 36px);
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: #dc2626;
      color: #fff;
      font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      isolation: isolate;
    }
    #leaveMeetingButton::before {
      content: "";
      position: absolute;
      inset: -10px -14px;
      z-index: -1;
      border-radius: 999px;
      background: #000;
    }
    #leaveMeetingButton:hover { background: #b91c1c; }
    #leaveMeetingButton:disabled {
      cursor: default;
      opacity: 0.72;
    }
    #classCountdown {
      position: fixed;
      left: 50%;
      top: calc(14px + env(safe-area-inset-top, 0px));
      transform: translateX(-50%);
      z-index: 2147483647;
      display: none;
      align-items: center;
      max-width: calc(100vw - 140px);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(180, 83, 9, 0.95);
      color: #fff;
      font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      text-align: center;
      line-height: 1.3;
    }
    #classCountdown.ended { background: rgba(220, 38, 38, 0.96); }
    @media (max-width: 640px), (pointer: coarse) {
      #zmmtg-root #wc-footer,
      #zmmtg-root [class*="footer" i],
      #zmmtg-root [class*="meeting-footer" i],
      #zmmtg-root [class*="meeting-bottom" i] {
        max-width: 100vw !important;
        overflow-x: auto !important;
        overflow-y: visible !important;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #zmmtg-root #wc-footer::-webkit-scrollbar,
      #zmmtg-root [class*="footer" i]::-webkit-scrollbar,
      #zmmtg-root [class*="meeting-footer" i]::-webkit-scrollbar,
      #zmmtg-root [class*="meeting-bottom" i]::-webkit-scrollbar {
        display: none;
      }
      #zmmtg-root [class*="footer-button" i],
      #zmmtg-root [class*="footer__" i],
      #zmmtg-root [class*="meeting-footer" i] button,
      #zmmtg-root [class*="meeting-bottom" i] button {
        flex: 0 0 auto !important;
      }
      #zmmtg-root button[aria-label*="Share" i],
      #zmmtg-root [role="button"][aria-label*="Share" i],
      #zmmtg-root button[title*="Share" i],
      #zmmtg-root [role="button"][title*="Share" i],
      #zmmtg-root [class*="share" i] {
        display: inline-flex !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        flex: 0 0 auto !important;
      }
    }
    .alluwal-classroom-hidden,
    button:not(#leaveMeetingButton)[aria-label*="Leave" i],
    button:not(#leaveMeetingButton)[aria-label*="End Meeting" i],
    button:not(#leaveMeetingButton)[title*="Leave" i],
    button:not(#leaveMeetingButton)[title*="End Meeting" i],
    [role="button"]:not(#leaveMeetingButton)[aria-label*="Leave" i],
    [role="button"]:not(#leaveMeetingButton)[aria-label*="End Meeting" i],
    [class*="footer" i] [aria-label*="Leave" i],
    [class*="footer" i] [aria-label*="End Meeting" i],
    [class*="footer" i] [title*="Leave" i],
    [class*="footer" i] [title*="End Meeting" i],
    [class*="leave-meeting" i],
    [class*="end-meeting" i] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="status"></div>
  <div id="classCountdown"></div>
  <button id="leaveMeetingButton" type="button"></button>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/react.min.js" crossorigin="anonymous"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/react-dom.min.js" crossorigin="anonymous"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/redux.min.js" crossorigin="anonymous"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/redux-thunk.min.js" crossorigin="anonymous"></script>
  <script src="https://source.zoom.us/6.2.0/lib/vendor/lodash.min.js" crossorigin="anonymous"></script>
  <script src="https://source.zoom.us/zoom-meeting-6.2.0.min.js" crossorigin="anonymous"></script>
  <script>
    const statusEl = document.getElementById('status');
    const leaveMeetingButton = document.getElementById('leaveMeetingButton');
    const initialHash = location.hash;
    window.addEventListener('hashchange', () => {
      if (location.hash && location.hash !== initialHash) {
        location.reload();
      }
    });
    const activeScreenShareStreams = new Set();
    const trackScreenShareStream = (stream) => {
      if (!stream || typeof stream.getVideoTracks !== 'function') return;
      activeScreenShareStreams.add(stream);
      for (const track of stream.getVideoTracks()) {
        try {
          track.addEventListener('ended', () => activeScreenShareStreams.delete(stream));
        } catch (_) {}
      }
    };
    const isScreenSharing = () => {
      for (const stream of activeScreenShareStreams) {
        try {
          if (stream.getVideoTracks().some((track) => track.readyState === 'live')) return true;
        } catch (_) {}
        activeScreenShareStreams.delete(stream);
      }
      return false;
    };
    const installScreenShareFocusGuard = () => {
      const mediaDevices = navigator.mediaDevices;
      if (!mediaDevices || typeof mediaDevices.getDisplayMedia !== 'function') return;
      if (mediaDevices.getDisplayMedia.__alluwalFocusGuardInstalled === true) return;

      const originalGetDisplayMedia = mediaDevices.getDisplayMedia.bind(mediaDevices);
      const supportsConditionalFocus =
        typeof window.CaptureController === 'function' &&
        window.CaptureController.prototype &&
        typeof window.CaptureController.prototype.setFocusBehavior === 'function';

      mediaDevices.getDisplayMedia = function(options) {
        let controller = options && typeof options === 'object' ? options.controller : null;
        let guardedOptions = options;
        if (!controller && supportsConditionalFocus) {
          try {
            controller = new window.CaptureController();
            guardedOptions = options && typeof options === 'object'
              ? Object.assign({}, options, { controller })
              : { video: true, controller };
          } catch (_) {
            controller = null;
          }
        }

        if (controller && typeof controller.setFocusBehavior === 'function') {
          try { controller.setFocusBehavior('no-focus-change'); } catch (_) {}
        }

        try { feedPipVideo(); } catch (_) {}
        const capturePromise = originalGetDisplayMedia(guardedOptions);
        try { requestZoomPictureInPicture(); } catch (_) {}
        if (!capturePromise || typeof capturePromise.then !== 'function') return capturePromise;

        return capturePromise.then((stream) => {
          if (controller && typeof controller.setFocusBehavior === 'function') {
            try { controller.setFocusBehavior('no-focus-change'); } catch (_) {}
          }
          trackScreenShareStream(stream);
          return stream;
        }, (error) => {
          throw error;
        });
      };
      mediaDevices.getDisplayMedia.__alluwalFocusGuardInstalled = true;
    };
    installScreenShareFocusGuard();
    // Keep the sharer's participant view visible after a tab switch.
    //
    // Why the previous approach failed: it called requestPictureInPicture()
    // directly on a Zoom-owned <video>. When the tab hides, the Zoom SDK
    // pauses/detaches/re-renders its own video elements, and Chrome closes a
    // PiP window the instant its element leaves the DOM, hence "PiP flashes
    // then disappears". So instead we PiP a video element THIS page owns and
    // never detaches, feed it from Zoom's live media (a video srcObject when
    // one exists, else canvas.captureStream() of Zoom's rendering canvas), and
    // hot-swap its source without closing the PiP window.
    const pipVideo = document.createElement('video');
    pipVideo.id = 'alluwalPipVideo';
    pipVideo.muted = true;
    pipVideo.autoplay = true;
    pipVideo.playsInline = true;
    pipVideo.setAttribute('playsinline', '');
    pipVideo.disablePictureInPicture = false;
    try {
      pipVideo.autoPictureInPicture = true;
      pipVideo.setAttribute('autopictureinpicture', '');
    } catch (_) {}
    pipVideo.style.cssText =
      'position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;';
    (document.body || document.documentElement).appendChild(pipVideo);
    const pipCanvas = document.createElement('canvas');
    pipCanvas.id = 'alluwalPipCanvas';
    pipCanvas.width = 640;
    pipCanvas.height = 360;
    pipCanvas.style.cssText =
      'position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;';
    (document.body || document.documentElement).appendChild(pipCanvas);
    let pipCanvasContext = null;
    let pipCanvasStream = null;
    let pipCanvasHasFrame = false;
    try {
      pipCanvasContext = pipCanvas.getContext('2d', { alpha: false });
      if (typeof pipCanvas.captureStream === 'function') {
        pipCanvasStream = pipCanvas.captureStream(15);
      }
    } catch (_) {}

    const liveStreamOf = (video) => {
      const stream = video.srcObject;
      if (!stream || typeof stream.getVideoTracks !== 'function') return null;
      try {
        return stream.getVideoTracks().some((track) => track.readyState === 'live')
          ? stream
          : null;
      } catch (_) {
        return null;
      }
    };
    const streamTrackIds = (stream) => {
      if (!stream || typeof stream.getVideoTracks !== 'function') return [];
      try {
        return stream.getVideoTracks().map((track) => track.id).filter(Boolean);
      } catch (_) {
        return [];
      }
    };
    const isActiveScreenShareStream = (stream) => {
      if (!stream) return false;
      const sourceTrackIds = new Set(streamTrackIds(stream));
      for (const shareStream of activeScreenShareStreams) {
        if (stream === shareStream) return true;
        for (const trackId of streamTrackIds(shareStream)) {
          if (sourceTrackIds.has(trackId)) return true;
        }
      }
      return false;
    };
    const elementArea = (el) => {
      const rect = el.getBoundingClientRect();
      return rect.width * rect.height;
    };
    const mediaElementContext = (el) => {
      const parts = [];
      let node = el;
      for (let depth = 0; node && depth < 5; depth += 1) {
        if (node.id) parts.push(node.id);
        if (typeof node.className === 'string') parts.push(node.className);
        if (node.getAttribute) {
          parts.push(
            node.getAttribute('aria-label') || '',
            node.getAttribute('title') || '',
            node.getAttribute('data-testid') || '',
            node.getAttribute('data-purpose') || '',
            node.getAttribute('data-type') || ''
          );
        }
        if (node.id === 'zmmtg-root') break;
        node = node.parentElement;
      }
      return parts.join(' ');
    };
    const sharedContentContextPattern =
      /\b(screen[\s_-]*share|share[\s_-]*(screen|content)|content[\s_-]*share|shared[\s_-]*content|sharing|whiteboard|presentation)\b/i;
    const participantVideoContextPattern =
      /\b(participant|gallery|video|camera|webcam|speaker|thumbnail|filmstrip|avatar|user|attendee)\b/i;
    const isVisibleMediaElement = (el) => {
      if (!el || !el.getBoundingClientRect) return false;
      const rect = el.getBoundingClientRect();
      if (rect.width < 24 || rect.height < 24) return false;
      const style = window.getComputedStyle(el);
      return style.display !== 'none' &&
        style.visibility !== 'hidden' &&
        Number(style.opacity || 1) > 0;
    };
    const frameSampleCanvas = document.createElement('canvas');
    frameSampleCanvas.width = 32;
    frameSampleCanvas.height = 18;
    let frameSampleContext = null;
    try {
      frameSampleContext = frameSampleCanvas.getContext('2d', { willReadFrequently: true });
    } catch (_) {}
    const mediaFrameQuality = (el) => {
      if (!frameSampleContext) return null;
      try {
        if (el.tagName === 'VIDEO') {
          if (Number(el.readyState || 0) < 2) return null;
          if (!el.videoWidth || !el.videoHeight) return null;
        }
        const sourceWidth = el.videoWidth || el.width || Math.round(el.getBoundingClientRect().width);
        const sourceHeight = el.videoHeight || el.height || Math.round(el.getBoundingClientRect().height);
        if (sourceWidth <= 1 || sourceHeight <= 1) return null;
        frameSampleContext.clearRect(0, 0, frameSampleCanvas.width, frameSampleCanvas.height);
        frameSampleContext.drawImage(el, 0, 0, frameSampleCanvas.width, frameSampleCanvas.height);
        const pixels = frameSampleContext.getImageData(
          0,
          0,
          frameSampleCanvas.width,
          frameSampleCanvas.height
        ).data;
        let lumaTotal = 0;
        let lumaSquaredTotal = 0;
        let nonDarkPixels = 0;
        let brightPixels = 0;
        let colorDeltaTotal = 0;
        const pixelCount = pixels.length / 4;
        for (let index = 0; index < pixels.length; index += 4) {
          const red = pixels[index];
          const green = pixels[index + 1];
          const blue = pixels[index + 2];
          const luma = (0.2126 * red) + (0.7152 * green) + (0.0722 * blue);
          lumaTotal += luma;
          lumaSquaredTotal += luma * luma;
          if (luma > 45) nonDarkPixels += 1;
          if (luma > 150) brightPixels += 1;
          colorDeltaTotal += Math.abs(red - green) + Math.abs(green - blue) + Math.abs(red - blue);
        }
        const averageLuma = lumaTotal / pixelCount;
        const variance = Math.max(0, (lumaSquaredTotal / pixelCount) - (averageLuma * averageLuma));
        const nonDarkRatio = nonDarkPixels / pixelCount;
        const brightRatio = brightPixels / pixelCount;
        const averageColorDelta = colorDeltaTotal / pixelCount;
        const blankAvatarLike = averageLuma < 70 &&
          nonDarkRatio < 0.24 &&
          brightRatio < 0.08 &&
          averageColorDelta < 45;
        const cameraLikeScore =
          (nonDarkRatio * 9000000) +
          (Math.min(variance, 5000) * 900) +
          (Math.min(averageColorDelta, 120) * 18000);
        return {
          averageLuma,
          variance,
          nonDarkRatio,
          brightRatio,
          averageColorDelta,
          blankAvatarLike,
          cameraLikeScore,
        };
      } catch (_) {
        return null;
      }
    };
    const participantCandidateScore = (el) => {
      if (!isVisibleMediaElement(el)) return Number.NEGATIVE_INFINITY;
      const area = elementArea(el);
      const viewportArea = Math.max(1, window.innerWidth * window.innerHeight);
      const areaRatio = area / viewportArea;
      const context = mediaElementContext(el);
      let score = Math.min(area, 250000);
      const frameQuality = mediaFrameQuality(el);
      if (frameQuality) {
        score += frameQuality.cameraLikeScore;
        if (frameQuality.blankAvatarLike) score -= 25000000;
      }
      if (participantVideoContextPattern.test(context)) score += 10000000;
      if (sharedContentContextPattern.test(context)) score -= 10000000;
      if (isScreenSharing()) {
        if (areaRatio > 0.35) score -= 8000000;
        if (areaRatio >= 0.002 && areaRatio <= 0.25) score += 5000000;
      } else {
        score += Math.min(area, 1000000);
      }
      return score;
    };
    const bestZoomVideoStream = () => {
      const videos = Array.from(document.querySelectorAll('#zmmtg-root video, video'))
        .map((video) => ({
          video,
          stream: video === pipVideo ? null : liveStreamOf(video),
          score: participantCandidateScore(video),
        }))
        .filter((candidate) => candidate.stream &&
          !isActiveScreenShareStream(candidate.stream) &&
          (!isScreenSharing() || candidate.score > 0));
      videos.sort((first, second) => second.score - first.score);
      return videos.length ? videos[0].stream : null;
    };
    const bestZoomDrawableElement = () => {
      const media = Array.from(document.querySelectorAll('#zmmtg-root video, #zmmtg-root canvas, video, canvas'))
        .filter((element) => element !== pipVideo && element !== pipCanvas)
        .map((element) => ({
          element,
          stream: element.tagName === 'VIDEO' ? liveStreamOf(element) : null,
          score: participantCandidateScore(element),
        }))
        .filter((candidate) => {
          if (candidate.stream && isActiveScreenShareStream(candidate.stream)) return false;
          return !isScreenSharing() || candidate.score > 0;
        });
      media.sort((first, second) => second.score - first.score);
      return media.length ? media[0].element : null;
    };
    const bestZoomCanvasStream = () => {
      const canvases = Array.from(document.querySelectorAll('#zmmtg-root canvas, canvas'))
        .filter((canvas) => canvas !== pipCanvas &&
          canvas.width > 1 && canvas.height > 1 &&
          typeof canvas.captureStream === 'function')
        .map((canvas) => ({ canvas, score: participantCandidateScore(canvas) }))
        .filter((candidate) => !isScreenSharing() || candidate.score > 0);
      canvases.sort((first, second) => second.score - first.score);
      const canvas = canvases.length ? canvases[0].canvas : null;
      if (!canvas) return null;
      try {
        const cached = canvas.__alluwalPipStream;
        const cachedLive = cached &&
          cached.getVideoTracks().some((track) => track.readyState === 'live');
        if (!cachedLive) canvas.__alluwalPipStream = canvas.captureStream(15);
        return canvas.__alluwalPipStream;
      } catch (_) {
        return null;
      }
    };
    const drawPipCanvasFrame = () => {
      if (!pipCanvasContext) return false;
      const sourceElement = bestZoomDrawableElement();
      if (!sourceElement) return pipCanvasHasFrame;
      const sourceWidth = sourceElement.videoWidth || sourceElement.width ||
        Math.round(sourceElement.getBoundingClientRect().width) || 640;
      const sourceHeight = sourceElement.videoHeight || sourceElement.height ||
        Math.round(sourceElement.getBoundingClientRect().height) || 360;
      if (sourceWidth <= 1 || sourceHeight <= 1) return pipCanvasHasFrame;
      const targetWidth = Math.min(960, Math.max(320, sourceWidth));
      const targetHeight = Math.min(540, Math.max(180, sourceHeight));
      if (pipCanvas.width !== targetWidth || pipCanvas.height !== targetHeight) {
        pipCanvas.width = targetWidth;
        pipCanvas.height = targetHeight;
      }
      try {
        pipCanvasContext.fillStyle = '#000';
        pipCanvasContext.fillRect(0, 0, pipCanvas.width, pipCanvas.height);
        pipCanvasContext.drawImage(sourceElement, 0, 0, pipCanvas.width, pipCanvas.height);
        pipCanvasHasFrame = true;
      } catch (_) {}
      return pipCanvasHasFrame;
    };
    const feedPipVideo = () => {
      const hasCanvasFrame = drawPipCanvasFrame();
      const canvasStreamLive = Boolean(pipCanvasStream &&
        typeof pipCanvasStream.getVideoTracks === 'function' &&
        pipCanvasStream.getVideoTracks().some((track) => track.readyState === 'live'));
      if (hasCanvasFrame && canvasStreamLive) {
        if (pipVideo.srcObject !== pipCanvasStream) pipVideo.srcObject = pipCanvasStream;
        const canvasPlayAttempt = pipVideo.play();
        if (canvasPlayAttempt && typeof canvasPlayAttempt.catch === 'function') {
          canvasPlayAttempt.catch(() => {});
        }
        return true;
      }
      const current = pipVideo.srcObject;
      const currentLive = Boolean(current &&
        typeof current.getVideoTracks === 'function' &&
        current.getVideoTracks().some((track) => track.readyState === 'live'));
      // Prefer a real Zoom video stream; otherwise keep a still-live current
      // source; fall back to capturing Zoom's rendering canvas.
      const source = bestZoomVideoStream() ||
        (currentLive ? current : bestZoomCanvasStream());
      if (!source) return false;
      if (pipVideo.srcObject !== source) pipVideo.srcObject = source;
      const playAttempt = pipVideo.play();
      if (playAttempt && typeof playAttempt.catch === 'function') playAttempt.catch(() => {});
      return true;
    };
    const requestZoomPictureInPicture = async () => {
      if (!document.pictureInPictureEnabled) return false;
      if (document.pictureInPictureElement === pipVideo) return true;
      if (!feedPipVideo()) return false;
      try {
        await pipVideo.requestPictureInPicture();
        return true;
      } catch (error) {
        console.debug('Zoom picture-in-picture request skipped', error);
        return false;
      }
    };
    window.__alluwalPipDebug = {
      bestZoomVideoStream,
      bestZoomCanvasStream,
      bestZoomDrawableElement,
      drawPipCanvasFrame,
      mediaFrameQuality,
      participantCandidateScore,
      isActiveScreenShareStream,
      trackScreenShareStream,
      requestZoomPictureInPicture,
      feedPipVideo,
      pipVideo,
      pipCanvas,
    };
    // Zoom-owned videos must NOT be PiP candidates: Chrome's auto-PiP would
    // pick one, and the SDK detaches its elements on tab-hide, closing the PiP
    // window instantly. Our owned element must be the only eligible target.
    const suppressZoomOwnedPictureInPicture = () => {
      const videos = Array.from(document.querySelectorAll('#zmmtg-root video, video'));
      for (const video of videos) {
        if (video === pipVideo) continue;
        try {
          video.disablePictureInPicture = true;
          video.removeAttribute('autopictureinpicture');
          if ('autoPictureInPicture' in video) video.autoPictureInPicture = false;
        } catch (_) {}
      }
    };
    // The Zoom SDK loads after this script and may register its own
    // 'enterpictureinpicture' handler, which would replace ours (last
    // registration wins) and re-point auto-PiP at a doomed Zoom element.
    // Re-assert ours so it stays in control.
    const registerEnterPictureInPictureHandler = () => {
      try {
        if (navigator.mediaSession &&
            typeof navigator.mediaSession.setActionHandler === 'function') {
          navigator.mediaSession.setActionHandler('enterpictureinpicture', () => {
            requestZoomPictureInPicture();
          });
        }
      } catch (error) {
        console.debug('Automatic picture-in-picture action unavailable', error);
      }
    };
    // Deterministic path: Chrome's AUTOMATIC PiP has eligibility rules we
    // cannot control (mic/camera capture, a granted auto-PiP permission), and
    // screen-share-only sessions often do not qualify, so auto-PiP may simply
    // never fire. This button appears while the user is sharing; one click is
    // a real user gesture, which makes requestPictureInPicture() guaranteed to
    // open on our owned element, and the floating view then survives every tab
    // switch for the rest of the share.
    const pipButton = document.createElement('button');
    pipButton.id = 'alluwalPipButton';
    pipButton.type = 'button';
    pipButton.textContent = 'Keep participants visible';
    pipButton.style.cssText =
      'display:none;position:fixed;right:16px;bottom:86px;z-index:2147483647;' +
      'padding:11px 16px;border:none;border-radius:999px;background:#0e72ed;color:#fff;' +
      'font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;' +

        const dialogs = Array.from(document.querySelectorAll(dialogContainerSelector));
        for (const dialog of dialogs) {
          if (!isBreakoutInviteDialog(dialog)) continue;
          const buttons = Array.from(dialog.querySelectorAll('button, [role="button"]'));
          const joinButton = buttons.find((button) => {
            const label = compactText(elementLabel(button));
            return inviteAcceptLabel.test(label) && !inviteDeclineLabel.test(label);
          });
          if (joinButton) {
            joinButton.click();
            return true;
          }
        }
        return false;
      };
      const isBreakoutManagementDialog = (element) => {
        if (isBreakoutInviteDialog(element)) return false;
        const text = elementText(element);
        return /Breakout Rooms\s*(-|–)\s*In Progress/i.test(text) ||
          (/\bBreakout\s*Rooms?\b/i.test(text) &&
            /\b(Participants?|Rooms?|Join|Joined|Open|Close|Add Room|Broadcast|Assign|Options)\b/i.test(text)) ||
          (/Close All Rooms/i.test(text) && /Add Room/i.test(text));
      };
      const isBreakoutManagementControl = (element) =>
        isCompactControl(element) &&
        !withinBreakoutInviteDialog(element) && (
          /\b(Breakout\s*Rooms?|Close All Rooms|Add Room|Broadcast|Leave (?:Breakout )?Room|Recreate|Assign|Open All Rooms)\b/i
            .test(elementLabel(element)) ||
          (/\bOptions\b/i.test(elementLabel(element)) && /\bBreakout\b/i.test(elementLabel(element)))
        );
      const isDialogSizedContainer = (element) => {
        const rect = element.getBoundingClientRect();
        const className = String(element.className || '');
        if (element.getAttribute('role') === 'dialog' || /modal|dialog/i.test(className)) return true;
        return rect.width > 0 &&
          rect.height > 0 &&
          rect.width <= 900 &&
          rect.height <= 900 &&
          elementText(element).length <= 3000;
      };
      const suppressBreakoutManagementUi = () => {
        let suppressed = false;
        autoConfirmNoAudioVideoPrompt();
        autoAcceptBreakoutInvite();
        const controls = Array.from(document.querySelectorAll(classroomControlSelector));
        for (const control of controls) {
          if (isZoomMediaControl(control)) continue;
          if (isZoomAllowedUtilityControl(control)) continue;
          if (isBreakoutManagementControl(control)) {
            hiddenFromClassroom(classroomControlTarget(control));
            suppressed = true;
          }
          if (isZoomNativeLeaveControl(control)) {
            hiddenFromClassroom(classroomControlTarget(control));
            suppressed = true;
          }
        }
        if (hideControlsUnderLeaveButton()) suppressed = true;

        const explicitDialogs = Array.from(document.querySelectorAll(
          '[role="dialog"], .zm-modal, .ReactModal__Content, .zmu-modal, [class*="modal"], [class*="dialog"]'
        ));
        const fallbackDialogs = Array.from(document.querySelectorAll('div'))
          .filter((element) => isBreakoutManagementDialog(element) && isDialogSizedContainer(element))
          .sort((first, second) => elementText(first).length - elementText(second).length)
          .slice(0, 3);
        const dialogs = Array.from(new Set([...explicitDialogs, ...fallbackDialogs]));
        for (const dialog of dialogs) {
          if (isBreakoutManagementDialog(dialog) && isDialogSizedContainer(dialog)) {
            hiddenFromClassroom(dialog);
            suppressed = true;
          }
        }
        if (suppressed) hideStatus();
        return suppressed;
      };
      const blockBreakoutManagementEvent = (event) => {
        const rawTarget = event.target && event.target.nodeType === Node.TEXT_NODE
          ? event.target.parentElement
          : event.target;
        const target = rawTarget && rawTarget.closest
          ? rawTarget.closest(`${classroomControlSelector}, [role="dialog"], .zm-modal, .ReactModal__Content, .zmu-modal, [class*="modal"], [class*="dialog"]`)
          : null;
        if (!target) return;
        const dialog = target.closest
          ? target.closest('[role="dialog"], .zm-modal, .ReactModal__Content, .zmu-modal, [class*="modal"], [class*="dialog"]')
          : null;
        if (
          !isBreakoutManagementControl(target) &&
          !isZoomNativeLeaveControl(target) &&
          !isBreakoutManagementDialog(dialog)
        ) return;

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        if (isBreakoutManagementControl(target) || isZoomNativeLeaveControl(target)) {
          hiddenFromClassroom(classroomControlTarget(target));
        }
        suppressBreakoutManagementUi();
      };
      const startBreakoutManagementGuard = () => {
        if (breakoutManagementGuardStarted) return;
        breakoutManagementGuardStarted = true;
        document.addEventListener('click', blockBreakoutManagementEvent, true);
        document.addEventListener('pointerdown', blockBreakoutManagementEvent, true);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') suppressBreakoutManagementUi();
        }, true);
        const observer = new MutationObserver(() => suppressBreakoutManagementUi());
        observer.observe(document.body || document.documentElement, {
          childList: true,
          subtree: true,
        });
        setInterval(() => suppressBreakoutManagementUi(), 750);
        suppressBreakoutManagementUi();
      };
      const listenForBreakoutArrival = () => {
        if (breakoutRoomChangeListenerAttached) return;
        breakoutRoomChangeListenerAttached = true;
        try {
          if (typeof ZoomMtg.inMeetingServiceListener !== 'function') return;
          ZoomMtg.inMeetingServiceListener('onRoomStatusChange', async (event) => {
            const status = Number(event && event.status);
            if (autoJoinBreakoutRoom && (status === 3 || status === 4)) {
              setPrivateRoutingPending(true);
              setStatus(routingStillConnectingText);
            }
          });
        } catch (_) {}
      };
      const currentBreakoutRoom = async () => {
        const response = await zoomSdkCall('getCurrentBreakoutRoom');
        return response && response.result ? response.result : response;
      };
      const currentUserBreakoutStatus = async () => {
        try {
          const response = await zoomSdkCall('getUserStatus');
          return response && response.result ? response.result : response;
        } catch (_) {
          return null;
        }
      };
      const userStatusInRoom = (status) => {
        if (!status) return null;
        const raw = status.status ?? status.userStatus ?? status.roomStatus ?? status.value;
        const rawNumber = Number(raw);
        if (Number.isFinite(rawNumber)) {
          if (rawNumber === 3) return true;
          if (rawNumber === 4 || rawNumber === 5) return false;
        }
        const text = compactText(JSON.stringify(status));
        if (/\b(in[_ ]?room|started)\b/i.test(text)) return true;
        if (/\b(closing|closed|main[_ ]?session|not[_ ]?joined)\b/i.test(text)) return false;
        return null;
      };
      const isInTargetBreakoutRoom = async (targetRoomId = '') => {
        try {
          const room = await currentBreakoutRoom();
          const currentId = roomIdentifier(room);
          const currentName = roomDisplayName(room);
          const roomMatches = (targetRoomId && currentId && String(currentId) === String(targetRoomId)) ||
            (Boolean(currentName) &&
              normalizeRoomName(currentName) === normalizeRoomName(breakoutRoomName));
          if (!roomMatches) return false;
          const status = userStatusInRoom(await currentUserBreakoutStatus());
          return status !== false;
        } catch (_) {
          return false;
        }
      };
      let breakoutRenderMonitorStarted = false;
      const startBreakoutRenderMonitor = () => {
        if (breakoutRenderMonitorStarted || !autoJoinBreakoutRoom || !breakoutRoomName) return;
        breakoutRenderMonitorStarted = true;
        const startedAt = Date.now();
        const timer = setInterval(() => {
          const text = document.body ? document.body.innerText || '' : '';
          const isTargetRoomVisible = text.includes(breakoutRoomName);
          if (isTargetRoomVisible) {
            clearInterval(timer);
            markPrivateRoomReady();
            return;
          }
          if (Date.now() - startedAt > 120000) {
            clearInterval(timer);
          }
        }, 1000);
      };
      const startBreakoutAutomation = () => {
        if (breakoutAutomationStarted) return;
        if (!autoJoinBreakoutRoom || !breakoutRoomName) return;
        breakoutAutomationStarted = true;
        startBreakoutManagementGuard();
        listenForBreakoutArrival();
        startBreakoutRenderMonitor();
        setPrivateRoutingPending(true);
        setStatus(connectingText);
        setTimeout(() => {
          if (privateRoutingPending) setStatus(routingStillConnectingText);
        }, stillConnectingMs);
        setTimeout(() => {
          if (privateRoutingPending) setStatus(routingHelpText);
        }, routingHelpMs);
        let lastSelfJoinAttemptAt = 0;
        const selfJoinIfInvited = async () => {
          if (Date.now() - lastSelfJoinAttemptAt < 5000) return;
          const statusText = compactText(
            JSON.stringify((await currentUserBreakoutStatus()) || {})
          ).toLowerCase();
          if (!/invit/.test(statusText)) return;
          lastSelfJoinAttemptAt = Date.now();
          autoAcceptBreakoutInvite();
          try {
            // Once invited, the client holds the room token; the roomId from
            // our OWN getCurrentBreakoutRoom is the only one Zoom accepts here.
            const invitedRoom = await currentBreakoutRoom();
            const invitedRoomId = roomIdentifier(invitedRoom);
            if (invitedRoomId) {
              await zoomSdkCall('joinBreakoutRoom', { roomId: invitedRoomId })
                .catch((error) => console.warn('joinBreakoutRoom (invited) skipped', error));
            }
          } catch (_) {}
        };
        (async () => {
          while (true) {
            const inTargetRoom = await isInTargetBreakoutRoom(targetBreakoutRoomId);
            if (inTargetRoom) {
              markPrivateRoomReady();
              await sleep(5000);
              continue;
            }
            await selfJoinIfInvited().catch(() => {});
            if (!privateRoutingPending) {
              setPrivateRoutingPending(true);
              setStatus(routingStillConnectingText);
            }
            await sleep(1500);
          }
        })();
      };
      setStatus(connectingText);

      if (!sdkKey || !signature || !meetingNumber) {
        setStatus(loadErrorText);
      } else {
        ZoomMtg.setZoomJSLib('https://source.zoom.us/6.2.0/lib', '/av');
        ZoomMtg.preLoadWasm();
        ZoomMtg.prepareWebSDK();
        ZoomMtg.i18n.load('en-US');
        ZoomMtg.i18n.reload('en-US');
        ZoomMtg.init({
          leaveUrl: returnUrl || `${location.origin}${location.pathname}#left=1&leftText=${encodeURIComponent(leftText)}`,
          patchJsMedia: true,
          disableCORP: !window.crossOriginIsolated,
          defaultView: 'gallery',
          showMeetingHeader: true,
          videoHeader: true,
          videoDrag: true,
          isLockBottom: false,
          screenShare: true,
          sharingMode: 'both',
          showPureSharingContent: false,
          disableInvite: false,
          disableJoinAudio: false,
          disablePictureInPicture: false,
          disablePreview: true,
          disableRecord: false,
          disableReport: false,
          disableVoIP: false,
          disableCallOut: false,
          disableZoomPhone: false,
          hideShareAudioOption: false,
          isSupportAV: true,
          isSupportBreakout: true,
          isSupportCC: true,
          isSupportChat: true,
          isSupportNonverbal: true,
          isSupportPolling: true,
          isSupportQA: true,
          meetingInfo: [
            'topic',
            'host',
            'mn',
            'pwd',
            'telPwd',
            'invite',
            'participant',
            'dc',
            'enctype',
            'report'
          ],
          success: () => {
            const onJoinSuccess = () => {
              meetingJoinConfirmed = true;
              showLeaveMeetingButton();
              startClassCountdown();
              if (autoJoinBreakoutRoom) {
                showJoinedRoutingStatus();
              } else {
                hideStatus();
              }
              startBreakoutAutomation();
            };
            // A hub meeting can be briefly unavailable to a participant during
            // normal operation: a block-boundary handoff, or an automatic
            // meeting reset after the bot recovers from a corrupted instance.
            // Never hard-fail on that — keep the black "connecting" layer up and
            // retry with backoff so the class reconnects on its own the moment
            // the hub is back. The status text escalates over time so the user
            // knows we are still working, but we keep trying indefinitely.
            let joinAttempts = 0;
            const firstJoinAttemptAt = Date.now();
            const retryStatusForElapsed = () => {
              const elapsed = Date.now() - firstJoinAttemptAt;
              if (elapsed >= routingHelpMs) return routingHelpText;
              if (elapsed >= stillConnectingMs) return routingStillConnectingText;
              return connectingText;
            };
            const scheduleJoinRetry = () => {
              const delay = Math.min(2000 * Math.pow(2, Math.min(joinAttempts, 4)), 30000);
              setStatus(retryStatusForElapsed());
              setTimeout(() => attemptZoomJoin(), delay);
            };
            const attemptZoomJoin = () => {
              joinAttempts += 1;
              let settled = false;
              const finishJoinAttempt = (callback) => {
                if (settled) return;
                settled = true;
                clearTimeout(joinTimer);
                callback();
              };
              const handleJoinFailure = (error, timedOut = false) => {
                console.error(timedOut ? 'Zoom join timed out' : 'Zoom join failed', {
                  error,
                  meetingNumber,
                  hasPassword: Boolean(password),
                  autoJoinBreakoutRoom,
                  joinAttempts,
                });
                if (timedOut && isZoomMeetingUiVisible()) {
                  onJoinSuccess();
                  return;
                }
                if (!attemptedActiveMeetingRecovery && isConcurrentHostMeetingError(error)) {
                  attemptedActiveMeetingRecovery = true;
                  console.warn('Zoom join blocked by another active browser meeting; retrying after closing older classroom tabs', {
                    meetingNumber,
                  });
                  announceZoomSession();
                  setStatus(connectingText);
                  setTimeout(() => {
                    attemptZoomJoin();
                  }, 1600);
                  return;
                }
                // Transient hub unavailability (boundary handoff / meeting reset
                // / host not present yet): keep the connecting layer and retry.
                scheduleJoinRetry();
              };
              const joinTimer = setTimeout(() => {
                finishJoinAttempt(() => handleJoinFailure(joinTimeoutError(), true));
              }, joinAttemptTimeoutMs);
              const joinOptions = {
                sdkKey,
                signature,
                meetingNumber,
                passWord: password,
                userName: displayName,
                customerKey,
                success: () => finishJoinAttempt(onJoinSuccess),
                error: (error) => finishJoinAttempt(() => handleJoinFailure(error)),
              };
              try {
                ZoomMtg.join(joinOptions);
              } catch (error) {
                finishJoinAttempt(() => handleJoinFailure(error));
              }
            };
            startMeetingUiMonitor();
            announceZoomSession();
            setTimeout(() => {
              attemptZoomJoin();
            }, 900);
          },
          error: (error) => {
            console.error('Zoom init failed', { error });
            setStatus(formatZoomError(initErrorText, error));
          },
        });
      }
    }
  </script>
</body>
</html>
