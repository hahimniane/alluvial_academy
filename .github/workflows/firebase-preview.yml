name: Firebase Hosting Preview

# Builds the Flutter web app and deploys it to a temporary Firebase Hosting
# preview channel for every PR. Posts a comment on the PR with the preview URL.
# Previews auto-expire in 7 days to keep the channel list clean.
#
# Notes:
# - Deploys to the `alluwal-dev` project (not prod).
# - Not a required check. A failed preview does not block PR merging.
# - Skipped on fork PRs (they cannot access repo secrets by design).
# - Temporarily disabled while the `alluwal-dev` project is inactive.

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-preview.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview to alluwal-dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Disabled until the alluwal-dev Firebase project is active again.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version we actually build and ship with. Leaving this
          # on bare `stable` meant CI silently drifted to Flutter 3.47/Dart 3.13
          # while releases were built on 3.44/Dart 3.12 — the newer analyser
          # rejects livekit_client 2.8.0, so CI failed on code nobody had
          # touched. Bump this deliberately, together with a local build.
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALLUWAL_DEV }}
          projectId: alluwal-dev
          expires: 7d
